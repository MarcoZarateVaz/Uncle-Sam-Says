<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A3161">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uncle Sam Says">
<link rel="icon" type="image/png" sizes="48x48" href="./icons/icon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<title>Uncle Sam Says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
--flag-blue:#0A3161;
--bg-panel:#123A6E;
--bg-panel-2:#164680;
--flag-red:#B31942;
--white:#FFFFFF;
--gold:#D9AE4E;
--gold-soft:rgba(217,174,78,0.28);
--paper:#F8F5EC;
--paper-line:#E3D9BC;
--ink:#241C10;
--ink-soft:#5B5240;
--stamp-green:#2F7A52;
}
*{box-sizing:border-box;}
body{
margin:0;
background:var(--flag-blue);
color:#E9EDF5;
font-family:'IBM Plex Sans','Noto Sans','Noto Sans SC',sans-serif;
line-height:1.6;
}
.wrap{max-width:520px;margin:0 auto;padding:2rem 1.25rem 3rem;}
h1{
font-family:'Fraunces',serif;
font-weight:600;
font-size:28px;
margin:0 44px 12px 0;
letter-spacing:0.2px;
color:var(--white);
}
.lang-btn{position:fixed;top:14px;right:14px;z-index:50;background:var(--bg-panel-2);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:7px 12px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;}
.lang-menu{position:fixed;top:50px;right:14px;z-index:50;background:var(--bg-panel-2);border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:6px;box-shadow:0 10px 24px rgba(0,0,0,0.4);min-width:150px;display:none;}
.lang-option{display:block;width:100%;text-align:left;background:transparent;border:none;color:#fff;padding:9px 10px;border-radius:6px;font-size:13px;font-family:'IBM Plex Sans','Noto Sans','Noto Sans SC',sans-serif;cursor:pointer;}
.lang-option.active{background:var(--gold-soft);color:var(--gold);font-weight:600;}
.bunting{display:flex;gap:3px;margin:0 0 16px;}
.bunting span{flex:1;height:4px;border-radius:2px;background:var(--flag-red);}
.bunting span:nth-child(even){background:var(--white);}
.lede{
color:rgba(255,255,255,0.75);
font-size:15px;
margin:0 0 22px;
max-width:48ch;
}
.abort-notice{background:rgba(179,25,66,0.18);border:1px solid var(--flag-red);border-radius:10px;padding:11px 14px;font-size:12.5px;color:#fff;margin-bottom:14px;}
.map-summary{display:flex;justify-content:space-between;background:var(--bg-panel);border:1px solid rgba(255,255,255,0.16);border-radius:10px;padding:11px 14px;margin-bottom:6px;font-size:13px;color:rgba(255,255,255,0.85);}
.daily-streak-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-panel-2);border:1px solid rgba(217,174,78,0.35);border-radius:10px;padding:11px 14px;margin-bottom:12px;}
.daily-streak-flame{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--gold);}
.daily-streak-note{font-size:12px;color:rgba(255,255,255,0.7);text-align:right;}
.autosave-note{font-size:11px;color:rgba(255,255,255,0.45);margin:0 0 14px;}
.exam-cta{display:block;width:100%;background:rgba(179,25,66,0.2);border:1px solid var(--flag-red);color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;margin-bottom:24px;text-align:center;}
.general-review-cta{display:block;width:100%;background:var(--gold);border:1px solid var(--gold);color:#241C10;border-radius:10px;padding:15px 16px;font-size:16px;font-weight:600;font-family:'Fraunces',serif;cursor:pointer;margin-bottom:24px;text-align:center;box-shadow:0 8px 18px rgba(217,174,78,0.28);}
.world-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--gold);margin:0 0 10px;}
.level-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
.level-node{width:62px;background:var(--bg-panel);border:1px solid rgba(255,255,255,0.22);border-radius:10px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;cursor:pointer;}
.level-node-label{font-size:13px;font-weight:600;color:#fff;}
.level-node-stars{font-size:12px;color:var(--gold);letter-spacing:1px;}
.level-node.locked{opacity:0.38;cursor:not-allowed;}
.level-node.locked .level-node-stars{font-size:14px;}
.level-node.cleared{border-color:var(--gold);background:rgba(217,174,78,0.16);}
.level-node.expert-node{border-color:var(--gold);background:rgba(217,174,78,0.1);}
.reset-btn{display:block;width:100%;background:transparent;border:1px solid rgba(179,25,66,0.4);color:rgba(255,255,255,0.6);border-radius:8px;padding:9px 12px;font-size:12px;font-family:inherit;cursor:pointer;margin-top:6px;text-align:center;}
.menu-item{margin-bottom:10px;text-align:left;}
.timer-track{height:6px;background:rgba(36,28,16,0.18);border-radius:3px;overflow:hidden;margin-bottom:12px;}
.timer-fill{height:100%;width:100%;background:var(--flag-red);}
.confirm-panel{background:var(--bg-panel-2);border:1px solid var(--flag-red);border-radius:10px;padding:20px 18px;}
.play-header{display:flex;align-items:center;gap:10px;margin-bottom:5px;}
.back-btn{background:transparent;border:1px solid rgba(255,255,255,0.32);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;cursor:pointer;flex-shrink:0;}
.play-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--white);}
.play-subtitle{font-size:12px;color:rgba(255,255,255,0.6);margin:0 0 16px;}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.stat{
background:var(--bg-panel);
border:1px solid rgba(255,255,255,0.16);
border-radius:10px;
padding:10px 12px;
}
.stat-label{font-size:11px;color:rgba(255,255,255,0.6);margin:0 0 4px;}
.stat-value{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--white);margin:0;}
.stat-sub{font-size:10px;color:rgba(255,255,255,0.48);margin:2px 0 0;}
.dots{display:flex;gap:6px;align-items:center;height:22px;}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);display:inline-block;}
.dot.filled{background:var(--gold);}
.dot.lost{border-color:rgba(217,174,78,0.28);background:transparent;}
#toast{min-height:22px;text-align:center;font-size:13px;color:var(--gold);opacity:0;transform:translateY(-4px);transition:opacity .3s ease, transform .3s cubic-bezier(0.34,1.56,0.64,1);margin-bottom:6px;}
#toast.show{opacity:1;transform:translateY(0);}
.card{
position:relative;
background:var(--paper);
color:var(--ink);
border-radius:6px;
padding:26px 22px 26px 28px;
min-height:190px;
display:flex;
flex-direction:column;
justify-content:center;
gap:9px;
box-shadow:0 14px 30px rgba(0,0,0,0.32);
overflow:hidden;
}
.card::before{
content:'';
position:absolute;
left:0;top:0;bottom:0;
width:7px;
background:repeating-linear-gradient(180deg, var(--flag-red) 0 8px, var(--white) 8px 16px, var(--flag-blue) 16px 24px);
}
.q-meta{font-size:11px;color:var(--ink-soft);letter-spacing:0.3px;}
.q-en{font-size:18px;font-weight:500;margin:0;}
.q-es{font-size:13.5px;color:var(--ink-soft);margin:0;}
.hint-line{font-family:'Courier New',monospace;font-size:13.5px;letter-spacing:0.5px;color:var(--ink-soft);margin:2px 0 0;}
.stamp{
position:absolute;
top:14px;
right:16px;
border:3px solid;
border-radius:6px;
padding:3px 11px;
font-family:'Fraunces',serif;
font-weight:600;
font-size:13px;
letter-spacing:1px;
transform:rotate(-9deg);
animation:stampIn .4s cubic-bezier(0.34,1.56,0.64,1);
}
.stamp.approve{color:var(--stamp-green);border-color:var(--stamp-green);}
.stamp.retry{color:var(--flag-red);border-color:var(--flag-red);}
@keyframes stampIn{from{opacity:0;transform:scale(1.5) rotate(-9deg);}to{opacity:1;transform:scale(1) rotate(-9deg);}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none;}}
#controls{margin-top:16px;}
.option-btn{display:block;width:100%;text-align:left;background:var(--bg-panel);border:1px solid rgba(255,255,255,0.22);color:#fff;border-radius:8px;padding:11px 14px;margin-bottom:8px;font-size:14px;font-family:inherit;cursor:pointer;transition:transform .15s ease, background .15s ease, border-color .15s ease;}
.option-btn.correct{background:rgba(47,122,82,0.38);border-color:var(--stamp-green);transform:scale(1.02);}
.option-btn.wrong{background:rgba(179,25,66,0.35);border-color:var(--flag-red);}
.option-btn:disabled{cursor:default;opacity:0.92;}
.answer-row{display:flex;gap:8px;}
.answer-input{flex:1;min-width:0;padding:11px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.28);background:rgba(255,255,255,0.07);color:#fff;font-size:14px;font-family:inherit;}
.answer-input::placeholder{color:rgba(255,255,255,0.42);}
.expert-textarea{width:100%;resize:vertical;margin-bottom:8px;display:block;}
.btn-check{background:var(--gold);border:1px solid var(--gold);color:#241C10;border-radius:8px;padding:11px 16px;font-weight:500;font-size:14px;font-family:inherit;cursor:pointer;}
.choice-row{display:flex;gap:8px;margin-top:4px;}
.choice-btn{flex:1;padding:11px 10px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;}
button.wide{
width:100%;
padding:12px 14px;
border-radius:8px;
font-family:inherit;
font-size:14px;
font-weight:500;
cursor:pointer;
}
.btn-reveal{background:var(--gold);border:1px solid var(--gold);color:#241C10;}
.btn-map{background:transparent;border:1px solid rgba(255,255,255,0.32);color:#fff;}
.btn-danger{background:var(--flag-red);border:1px solid var(--flag-red);color:#fff;}
.expert-reference{background:var(--bg-panel);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin-top:10px;}
.result-panel{background:var(--bg-panel-2);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:16px 16px 14px;margin-top:14px;}
.result-panel.correct{border-color:var(--stamp-green);}
.result-panel.wrong{border-color:var(--flag-red);}
.result-headline{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0 0 12px;}
.result-panel.correct .result-headline{color:#8FDDB2;}
.result-panel.wrong .result-headline{color:#F3A9A0;}
.panel-answer-label{font-size:11px;color:rgba(255,255,255,0.55);margin:0 0 3px;}
.panel-answer-value{font-size:16px;font-weight:600;color:var(--white);margin:0;}
.result-lives{display:flex;align-items:center;justify-content:space-between;margin:14px 0 16px;}
.result-lives .stat-label{margin:0;}
.end-screen{display:none;text-align:center;padding:1.5rem 0;}
.end-score{font-family:'Fraunces',serif;font-size:34px;font-weight:600;margin:0 0 6px;color:var(--white);letter-spacing:2px;}
.end-sub{font-size:13px;color:rgba(255,255,255,0.7);margin:0 0 6px;}
.end-pass{font-size:15px;font-weight:600;margin:10px 0 2px;}
.end-pass.pass{color:#8FDDB2;}
.end-pass.fail{color:#F3A9A0;}
.footnote{font-size:11.5px;color:rgba(255,255,255,0.45);margin-top:28px;line-height:1.6;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
button{transition:transform .12s ease;}
button:active{transform:scale(0.96);}
@keyframes cardShake{
10%,90%{transform:translateX(-1px);}
20%,80%{transform:translateX(2px);}
30%,50%,70%{transform:translateX(-5px);}
40%,60%{transform:translateX(5px);}
}
@keyframes cardPulse{
0%{transform:scale(1);}
45%{transform:scale(1.018);}
100%{transform:scale(1);}
}
.card-shake{animation:cardShake .5s ease;}
.card-pulse{animation:cardPulse .4s ease;}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card-enter{animation:cardEnter .32s cubic-bezier(0.22,1,0.36,1);}
@keyframes starPop{from{opacity:0;transform:scale(0) rotate(-35deg);}to{opacity:1;transform:scale(1) rotate(0deg);}}
.end-stars{display:inline-flex;gap:5px;}
.star-pop{display:inline-block;opacity:0;animation:starPop .5s cubic-bezier(0.34,1.56,0.64,1) forwards;}
.star-empty{display:inline-block;color:rgba(255,255,255,0.25);}
@keyframes mapEnter{from{opacity:0;}to{opacity:1;}}
.map-enter{animation:mapEnter .25s ease-out;}
@media (prefers-reduced-motion:reduce){
button{transition:none;}
button:active{transform:none;}
.card-shake,.card-pulse,.card-enter,.star-pop,.map-enter{animation:none;opacity:1;}
}
.eagle-mascot{position:fixed;top:0;left:0;width:150px;height:140px;pointer-events:none;z-index:40;opacity:0;will-change:transform,opacity;}
.eagle-sprite{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}
.eagle-mascot.flying-lr{animation:eagleFlyLR var(--eagle-duration,6s) linear forwards;}
.eagle-mascot.flying-rl{animation:eagleFlyRL var(--eagle-duration,6s) linear forwards;}
@keyframes eagleFlyLR{
0%{opacity:0;transform:translate(-15vw,var(--eagle-y,60px)) scaleX(1);}
8%{opacity:0.92;}
92%{opacity:0.92;}
100%{opacity:0;transform:translate(115vw,calc(var(--eagle-y,60px) - 40px)) scaleX(1);}
}
@keyframes eagleFlyRL{
0%{opacity:0;transform:translate(115vw,var(--eagle-y,60px)) scaleX(-1);}
8%{opacity:0.92;}
92%{opacity:0.92;}
100%{opacity:0;transform:translate(-15vw,calc(var(--eagle-y,60px) - 40px)) scaleX(-1);}
}
@media (prefers-reduced-motion:reduce){
.eagle-mascot{display:none;}
}

/* v3 enhancement layer */
.v3-toolbar{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.v3-tool{flex:1;min-width:110px;padding:10px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.24);background:var(--bg-panel);color:#fff;font:500 13px inherit;cursor:pointer}.v3-tool.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}.v3-tool.install-app{background:linear-gradient(135deg,var(--gold),#f0c65b);color:var(--ink);border-color:var(--gold);font-weight:700}.v3-tool.install-app[hidden]{display:none}
.v3-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:12px}.v3-modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--bg-panel);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.v3-modal h2{font-family:'Fraunces',serif;margin:0 0 6px;color:#fff}.v3-close{float:right;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}.v3-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}.v3-kpi{background:var(--bg-panel-2);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px}.v3-kpi b{display:block;font:600 24px 'Fraunces',serif;color:var(--gold)}.v3-kpi span{font-size:11px;color:rgba(255,255,255,.68)}.v3-section{margin-top:18px}.v3-section h3{font:600 15px 'Fraunces',serif;color:var(--gold);margin:0 0 9px}.v3-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}.v3-bar>i{display:block;height:100%;background:var(--gold);border-radius:99px}.v3-row{background:rgba(255,255,255,.06);border-radius:9px;padding:9px 10px;margin:6px 0;font-size:12px}.v3-row strong{color:#fff}.v3-muted{color:rgba(255,255,255,.6)}.v3-badge{display:inline-block;border:1px solid var(--gold);border-radius:99px;padding:5px 8px;margin:3px;font-size:11px;color:var(--gold)}.v3-settings label{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px}.v3-settings input{width:18px;height:18px}.v3-progress{height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:7px 0 12px}.v3-progress i{display:block;height:100%;background:var(--gold);width:0}.v3-install{position:fixed;left:12px;right:12px;bottom:12px;z-index:90;background:var(--bg-panel-2);border:1px solid var(--gold);border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:12px}.v3-install button{margin-top:8px}.v3-route{border-left:3px solid var(--gold);padding-left:10px}.v3-due{color:#F3A9A0}.v3-small{font-size:11px}.v3-exam-breakdown{margin-top:10px;text-align:left}.v3-cat-chip{display:flex;justify-content:space-between;gap:8px;margin:5px 0;font-size:12px}.v3-report-bottom{width:100%;margin:18px 0 6px;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font:500 13px inherit;cursor:pointer}.v3-report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.v3-report-choice{width:100%;padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;text-align:left;font:500 12px inherit;cursor:pointer}.v3-report-choice.active{border-color:var(--gold);background:rgba(217,174,78,.14)}.v3-report-current{background:rgba(255,255,255,.05);border:1px solid rgba(217,174,78,.25);border-radius:10px;padding:11px;margin:10px 0}.v3-report-current p{margin:4px 0;font-size:12px}.v3-report-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.v3-report-actions button{width:100%}@media(max-width:480px){.v3-report-grid{grid-template-columns:1fr}.v3-report-actions{grid-template-columns:1fr}}
@media(min-width:700px){.v3-modal-backdrop{align-items:center}.v3-modal{border-radius:18px}.v3-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}


.v3-profile{display:grid;gap:12px}.v3-profile label{display:grid;gap:6px;font-size:13px;color:rgba(255,255,255,.75)}.v3-profile select,.v3-profile input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:var(--bg-panel-2);color:var(--white);font:inherit}.v3-state-info{margin:10px 0 2px;padding:12px;border:1px solid rgba(217,174,78,.28);border-radius:10px;background:rgba(255,255,255,.05)}.v3-state-info-title{font:600 14px 'Fraunces',serif;color:var(--gold);margin:0 0 8px}.v3-state-info-row{font-size:12px;color:rgba(255,255,255,.8);margin:4px 0}.v3-state-info-row strong{color:#fff}.v3-answer-list{margin:6px 0 0;padding-left:20px;color:var(--white)}.v3-answer-list li{margin:3px 0}.v3-small{font-size:12px;line-height:1.5}.v3-modal select option{background:#18221d;color:#fff}

/* App brand header */
.brand-header{display:flex;align-items:center;gap:12px;margin:0 44px 12px 0;}
.app-logo{width:58px;height:58px;object-fit:cover;border-radius:14px;flex:0 0 58px;box-shadow:0 5px 16px rgba(0,0,0,.22);}
.brand-header h1{margin:0;flex:1;}
@media(max-width:420px){.brand-header{gap:10px;margin-right:38px}.app-logo{width:52px;height:52px;flex-basis:52px;border-radius:13px}h1{font-size:25px;line-height:1.08}}
</style>
</head>
<body>
<button class="lang-btn" id="lang-btn" onclick="toggleLangMenu()"></button>
<div class="lang-menu" id="lang-menu"></div>
<div class="eagle-mascot" id="eagle-mascot" aria-hidden="true"><img class="eagle-sprite" id="eagle-sprite" src="assets/animations/eagle_1.png" alt=""></div>
<div class="wrap">

<div class="brand-header"><img class="app-logo" src="./assets/logo-source.png" alt="Uncle Sam Says"><h1 id="h1-title">Uncle Sam Says</h1></div>
<div class="bunting" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<p class="lede" id="lede-text"></p>

<div id="map-view"></div>

<div id="play-view" style="display:none">
<div class="play-header">
<button class="back-btn" id="back-to-map"></button>
<span class="play-title" id="play-title"></span>

function profileAnswers(n){var st=STATE_DATA[USER_PROFILE.state];if(n===23)return st?st.senators.slice():[];if(n===61)return st?[st.governor]:[];if(n===62)return st?[st.capital]:[];if(n===29&&USER_PROFILE.representative)return [USER_PROFILE.representative];return [];}
function acceptedAnswers(item){var dynamic=profileAnswers(item.n);if(dynamic.length)return dynamic;return (OFFICIAL_ANSWERS[item.n]||[item.a]).slice();}
function primaryAnswer(item){var a=acceptedAnswers(item);return a[0]||item.a;}
function randomAcceptedAnswer(item){var a=acceptedAnswers(item);return a.length?a[Math.floor(Math.random()*a.length)]:item.a;}
function acceptedHtml(item){return acceptedAnswers(item).map(function(x){return '<li>'+String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</li>';}).join('');}
function answerCountRequired(item){return REQUIRED_COUNTS[item.n]||1;}
function needsProfile(item){return item&&(item.n===23||item.n===61||item.n===62||item.n===29)&&((item.n===29&&!USER_PROFILE.representative)||((item.n===23||item.n===61||item.n===62)&&!USER_PROFILE.state));}
function ensureProfile(item){if(!needsProfile(item))return true;renderProfileModal();return false;}
function isAcceptedText(typed,item,strictness){var answers=acceptedAnswers(item),need=answerCountRequired(item),tNorm=normalize(typed),tTok=tokenize(typed);if(!answers.length)return false;var matched=0;
answers.forEach(function(exp){var eTok=tokenize(exp);if(!eTok.length)return;var exact=tNorm.indexOf(normalize(exp).replace(/\([^)]*\)/g,'').trim())!==-1;var m=0;eTok.forEach(function(t2){if(tTok.indexOf(t2)!==-1)m++;});var ratio=eTok.length<=2?(m>=1?1:0):m/eTok.length;if(exact||ratio>=(strictness==='hard'?.4:.3))matched++;});return matched>=need;}

var opts=Object.keys(STATE_DATA).map(function(k){var st=STATE_DATA[k];return '<option value="'+k+'" '+(USER_PROFILE.state===k?'selected':'')+'>'+st.name+'</option>';}).join('');

en: [
"The U.S. is a republic: citizens elect representatives \u2014 senators, House members, the president \u2014 to govern for them, rather than a king ruling or the people voting directly on every law.",
"Article VI's Supremacy Clause (1788) makes the Constitution and federal law override any conflicting state law. Courts have enforced this since Marbury v. Madison in 1803.",
"The Constitution's seven articles, effective 1789, create Congress, the presidency, and federal courts, and define how each is chosen and what powers each holds.",
"The Preamble's opening words, \u2018We the People,\u2019 mean the government's authority comes from the consent of the governed, not a monarch \u2014 a radical idea for 1787.",
"Article V lets two-thirds of Congress (or the states) propose an amendment, and three-fourths of the states must ratify it \u2014 intentionally hard, which is why only 27 have passed since 1789.",
"The Bill of Rights \u2014 the first 10 amendments, ratified together in 1791 \u2014 protects freedoms like speech and religion from the federal government. James Madison drafted most of them.",
"27 amendments have passed since 1789: the Bill of Rights (10, in 1791) plus 17 more, most recently the 27th Amendment on congressional pay, ratified in 1992.",
"Adopted July 4, 1776, the Declaration lists the colonies' grievances against King George III and formally announces their split from Great Britain.",
"The Second Continental Congress adopted the Declaration on July 4, 1776. Thomas Jefferson wrote the first draft, with edits from Benjamin Franklin and John Adams.",
"The Declaration's \u2018all men are created equal\u2019 and the Constitution's protections both rest on the idea that people are born with rights no government can fairly take away.",
"\u2018Life, Liberty, and the pursuit of Happiness\u2019 appears in the Declaration's second paragraph, adapted by Jefferson from philosopher John Locke's \u2018life, liberty, and property.\u2019",
"Private individuals and companies \u2014 not the government \u2014 own most property and decide what to produce and sell, guided mainly by supply and demand.",
"No one, not even the president, is above the law \u2014 which is why presidents can be investigated, sued, or impeached, and courts can strike down illegal government actions.",
"Beyond inspiring the Constitution's spirit, the Declaration's ideas about natural rights were reference points the framers argued from at the 1787 Constitutional Convention.",
"The framers split power into three branches after studying philosopher Montesquieu's writings, fearing that concentrating power in one place \u2014 as under King George III \u2014 leads to tyranny.",
"Articles I, II, and III create Congress (legislative, makes laws), the presidency (executive, enforces laws), and federal courts (judicial, interprets laws), each checking the others.",
"Article II names the president head of the executive branch, responsible for enforcing the laws Congress passes and commanding the military.",
"Article I gives \u2018all legislative powers\u2019 to Congress \u2014 the only body that can pass federal laws.",
"The framers split Congress in the 1787 \u2018Great Compromise\u2019: the Senate gives every state equal power (2 seats each), while the 435-seat House is based on population.",
"Congress's core Article I power is writing and passing federal legislation; bills must clear both the House and Senate before reaching the president.",
"100 senators serve today: 2 from each of the 50 states, up from the original 26 (2 from each of the 13 founding states).",
"Senators serve staggered 6-year terms, with about a third of seats up every 2 years, so the whole Senate never turns over at once.",
"Georgia's current U.S. senators are Jon Ossoff and Raphael Warnock, both Democrats first elected in the January 2021 runoff.",
"The House has had 435 voting members since the Permanent Apportionment Act of 1929; seats are reapportioned among states after each census.",
"House members serve 2-year terms, the shortest of any federal office, so the whole chamber faces voters every cycle.",
"The framers made House terms short so representatives stay closely accountable to constituents' current views, unlike the Senate's longer terms.",
"Every state gets exactly 2 senators regardless of population \u2014 California and Wyoming each have 2 \u2014 under the 1787 Great Compromise.",
"Small states like Delaware insisted on equal Senate representation at the 1787 Convention, fearing large states would otherwise dominate.",
"Your representative depends on your congressional district; Georgia currently has 14. You can look yours up at house.gov.",
"Mike Johnson, a Republican from Louisiana, has served as Speaker of the House since October 2023.",
"Senators represent their entire state's interests in Congress, unlike House members, who represent only their district.",
"Since the 17th Amendment (1913), senators are elected directly by statewide voters; before that, state legislatures chose them.",
"Each House member represents only the voters within their specific congressional district, one of 435 nationwide.",
"Voters within a House member's specific district elect them directly every 2 years.",
"The 435 House seats are reapportioned after each census (most recently 2020) based on population, so fast-growing states gain seats.",
"The Constitution sets a 4-year presidential term, balancing enough time to govern against regular accountability to voters.",
"Ratified in 1951 after Franklin D. Roosevelt won four terms (1933-1945), the 22nd Amendment limits presidents to two elected terms.",
"Donald Trump is the current U.S. president, inaugurated for his second, non-consecutive term in January 2025.",
"JD Vance, previously a U.S. senator from Ohio, is the current vice president, inaugurated in January 2025.",
"The Constitution's line of succession, detailed further by the 25th Amendment (1967), puts the vice president first if a president dies, resigns, or is removed.",
"A bill becomes law only once the president signs it \u2014 or if a veto is overridden by two-thirds of both chambers of Congress.",
"Article II makes the president Commander in Chief of the armed forces, though only Congress can formally declare war.",
"Bills passed by Congress sit on the president's desk; signing enacts them into law.",
"A presidential veto rejects a bill Congress passed; Congress can override it with a two-thirds vote in both chambers.",
"The president nominates federal judges, including Supreme Court justices, but the Senate must confirm each by majority vote.",
"The Cabinet \u2014 currently 15 department heads, like the Secretary of State \u2014 advises the president and runs the federal bureaucracy day to day.",
"Each Cabinet secretary brings expertise from their department (State, Defense, Treasury, etc.) to inform the president's decisions.",
"The Secretary of State leads foreign policy and diplomacy; the Attorney General heads the Justice Department as the government's chief lawyer.",
"Presidents are chosen by the Electoral College, not a national popular vote \u2014 currently 538 electors total, with 270 needed to win.",
"The Supreme Court is the only federal court the Constitution itself requires (Article III); Congress created every lower federal court.",

"A simple majority of the nine justices \u2014 5 votes \u2014 decides most Supreme Court cases.",
"Article III gives federal judges lifetime tenure (\u2018during good Behaviour\u2019), so they serve until retirement, resignation, death, or impeachment.",
"Lifetime appointment insulates justices from needing to please voters or the president who appointed them.",
"John Roberts has served as Chief Justice since 2005, appointed by President George W. Bush.",
"Coining money, declaring war, and making treaties belong only to the federal government, so the country speaks with one voice internationally.",
"Powers not given to the federal government \u2014 like running public schools or issuing driver's licenses \u2014 stay with the states under the 10th Amendment.",
"Ratified in 1791 as part of the Bill of Rights, the 10th Amendment reserves powers the Constitution doesn't give the federal government to the states or the people.",
"Brian Kemp, a Republican, has served as Georgia's governor since January 2019.",
"Atlanta has been Georgia's state capital since 1868, replacing Milledgeville.",
"The 26th Amendment, ratified in 1971 during the Vietnam War era, lowered the voting age from 21 to 18.",
"Voting in federal elections, running for federal office, and serving on federal juries are rights reserved for U.S. citizens.",
"The First Amendment (1791) protects speech, religion, press, and assembly for everyone in the U.S., citizens and non-citizens alike.",
"The Pledge of Allegiance, written in 1892 and given its current wording by Congress in 1954, expresses loyalty to \u2018the flag ... and to the Republic for which it stands.\u2019",
"The Oath of Allegiance, recited at every naturalization ceremony, requires renouncing prior allegiances and pledging to obey U.S. laws.",
"Naturalization is the legal process \u2014 requiring years of residency, an English and civics test, and an interview \u2014 by which a non-citizen becomes a citizen.",
"Voting and running for office are two of the most direct ways citizens shape their government.",
"Voting in local, state, and federal elections is the most basic way citizens influence who makes decisions on their behalf.",
"The 16th Amendment (1913) authorized a federal income tax, which the Internal Revenue Code now requires most residents to pay annually.",
"The Military Selective Service Act requires almost all men ages 18-25 living in the U.S. to register, regardless of immigration status.",
"Colonists came for varied reasons: Puritans and Quakers fled religious persecution, while others sought farmland or trade opportunities.",
"Native American nations had lived across the continent for over 10,000 years before European colonization began in the late 1400s and 1500s.",
"Beginning in 1619 at Jamestown, Virginia, and continuing for two centuries, hundreds of thousands of Africans were forcibly transported and sold into slavery.",

"Thomas Jefferson, a 33-year-old Virginia delegate, was chosen by the Continental Congress to write the Declaration's first draft in June 1776.",

"The 13 original colonies were New Hampshire, Massachusetts, Rhode Island, Connecticut, New York, New Jersey, Pennsylvania, Delaware, Maryland, Virginia, North Carolina, South Carolina, and Georgia.",
"Delegates met in Philadelphia from May to September 1787 and wrote an entirely new Constitution, signed September 17, 1787.",
"Alexander Hamilton, James Madison, and John Jay wrote 85 essays under the pen name \u2018Publius\u2019 in 1787-1788 to build support for ratification.",
"The Federalist Papers explained the reasoning behind the Constitution's structure, helping convince skeptical state ratifying conventions.",
"Benjamin Franklin founded the Library Company of Philadelphia in 1731, often called America's first successful lending library.",
"George Washington was unanimously elected in 1789, served two terms, and voluntarily stepped down in 1797, setting a precedent for peaceful transfer of power.",
"Thomas Jefferson, later the 3rd president (1801-1809), is best remembered as the principal author of the 1776 Declaration.",
"James Madison earned this nickname for his central role at the 1787 Convention and later for writing the Bill of Rights as a congressman.",
"Alexander Hamilton, appointed by Washington in 1789, established the national bank and the financial system of the new country.",
"In 1803, President Thomas Jefferson bought roughly 828,000 square miles from France for about $15 million, doubling the size of the country.",
"The Civil War (1861-1865), fought over slavery and states' rights, remains the deadliest war in U.S. history, with over 600,000 deaths.",
"The Civil War pitted the Northern states (the Union, under President Lincoln) against 11 Southern states that seceded to form the Confederacy.",
"Issued by President Lincoln on January 1, 1863, the Emancipation Proclamation declared enslaved people in Confederate territory free.",

"The Emancipation Proclamation (January 1, 1863) declared enslaved people in Confederate states legally free.",

"The 15th Amendment, ratified in 1870, barred denying the vote based on race, though it took the Voting Rights Act of 1965 to enforce it fully.",

es: [
"EE. UU. es una república: los ciudadanos eligen representantes \u2014senadores, diputados, presidente\u2014 para gobernar en su nombre, en vez de un rey o votación directa en cada ley.",
"La Cláusula de Supremacía del Artículo VI (1788) hace que la Constitución y las leyes federales superen a cualquier ley estatal. Los tribunales lo aplican desde Marbury v. Madison en 1803.",
"Los siete artículos originales, vigentes desde 1789, crean el Congreso, la presidencia y los tribunales federales, y definen cómo se elige a cada uno.",
"Las palabras iniciales del Preámbulo, \u2018Nosotros el pueblo\u2019, significan que el gobierno obtiene su autoridad del consentimiento de los gobernados, no de un monarca \u2014idea radical en 1787.",
"El Artículo V permite que dos tercios del Congreso propongan una enmienda y tres cuartas partes de los estados la ratifiquen \u2014deliberadamente difícil, por eso solo 27 han pasado desde 1789.",
"La Carta de Derechos \u2014las primeras 10 enmiendas, ratificadas juntas en 1791\u2014 protege libertades como la de expresión y religión frente al gobierno federal. James Madison redactó la mayoría.",
"27 enmiendas se han ratificado desde 1789: la Carta de Derechos (10, en 1791) más 17 más, la más reciente sobre el sueldo del Congreso, ratificada en 1992.",
"Adoptada el 4 de julio de 1776, la Declaración enumera los agravios de las colonias contra el rey Jorge III y anuncia formalmente su separación de Gran Bretaña.",
"El Segundo Congreso Continental adoptó la Declaración el 4 de julio de 1776. Thomas Jefferson escribió el primer borrador, con ediciones de Benjamin Franklin y John Adams.",
"\u2018Todos los hombres son creados iguales\u2019 de la Declaración y las protecciones de la Constitución parten de que las personas nacen con derechos que ningún gobierno puede quitar con justicia.",
"\u2018Vida, Libertad y la búsqueda de la Felicidad\u2019 aparece en el segundo párrafo de la Declaración, adaptado por Jefferson de la frase del filósofo John Locke sobre \u2018vida, libertad y propiedad\u2019.",
"Personas y empresas privadas \u2014no el gobierno\u2014 poseen la mayoría de la propiedad y deciden qué producir y vender, guiadas por la oferta y la demanda.",
"Nadie, ni siquiera el presidente, está por encima de la ley \u2014por eso los presidentes pueden ser investigados, demandados o sometidos a juicio político.",
"Más allá de inspirar el espíritu de la Constitución, las ideas de la Declaración sobre derechos naturales fueron referencia directa en la Convención de 1787.",
"Los redactores dividieron el poder en tres ramas tras estudiar al filósofo Montesquieu, temiendo que concentrar el poder \u2014como bajo el rey Jorge III\u2014 llevara a la tiranía.",
"Los Artículos I, II y III crean el Congreso (legislativo, hace leyes), la presidencia (ejecutivo, las aplica) y los tribunales federales (judicial, las interpreta).",
"El Artículo II nombra al presidente jefe del poder ejecutivo, encargado de hacer cumplir las leyes del Congreso y comandar las fuerzas armadas.",
"El Artículo I otorga \u2018todos los poderes legislativos\u2019 al Congreso, el único órgano que puede aprobar leyes federales.",
"Los redactores dividieron el Congreso en el \u2018Gran Compromiso\u2019 de 1787: el Senado da a cada estado el mismo peso (2 escaños), mientras la Cámara, con 435 escaños, se basa en población.",
"El poder principal del Congreso según el Artículo I es escribir y aprobar leyes federales; los proyectos deben pasar por ambas cámaras antes de llegar al presidente.",
"Hoy sirven 100 senadores: 2 por cada uno de los 50 estados, más que los 26 originales (2 por cada una de las 13 colonias fundadoras).",
"Los senadores sirven periodos escalonados de 6 años, con un tercio de los escaños en juego cada 2 años, así el Senado nunca se renueva por completo de golpe.",
"Los senadores actuales de Georgia son Jon Ossoff y Raphael Warnock, ambos demócratas elegidos por primera vez en la segunda vuelta de enero de 2021.",
"La Cámara tiene 435 miembros con voto desde la Ley de Repartición Permanente de 1929; los escaños se redistribuyen entre estados tras cada censo.",
"Los diputados sirven periodos de 2 años, los más cortos de cualquier cargo federal, así toda la Cámara enfrenta a los votantes en cada ciclo.",
"Los redactores hicieron cortos los periodos de la Cámara para que los diputados respondan de cerca a la opinión actual de sus electores.",
"Cada estado tiene exactamente 2 senadores sin importar su población \u2014California y Wyoming tienen 2 cada uno\u2014 por el Gran Compromiso de 1787.",
"Estados pequeños como Delaware exigieron representación igualitaria en el Senado durante la Convención de 1787, temiendo el dominio de los estados grandes.",
"Tu representante depende de tu distrito congresional; Georgia tiene actualmente 14. Puedes buscarlo en house.gov.",
"Mike Johnson, republicano de Luisiana, es el presidente de la Cámara desde octubre de 2023.",
"Los senadores representan los intereses de todo su estado en el Congreso, a diferencia de los diputados, que solo representan su distrito.",
"Desde la 17ª Enmienda (1913), los senadores se eligen directamente por voto popular estatal; antes los elegían las legislaturas estatales.",
"Cada diputado representa solo a los votantes de su distrito congresional específico, uno de los 435 en todo el país.",
"Los votantes de un distrito eligen directamente a su diputado cada 2 años.",
"Los 435 escaños de la Cámara se redistribuyen tras cada censo (el más reciente en 2020) según población, así los estados que crecen ganan escaños.",
"La Constitución fija un periodo presidencial de 4 años, equilibrando tiempo suficiente para gobernar con rendición de cuentas frecuente.",
"Ratificada en 1951 después de que Franklin D. Roosevelt ganara cuatro periodos (1933-1945), la 22ª Enmienda limita al presidente a dos periodos electos.",
"Donald Trump es el presidente actual de EE. UU., investido para su segundo periodo no consecutivo en enero de 2025.",
"JD Vance, exsenador de Ohio, es el actual vicepresidente, investido en enero de 2025.",
"La línea de sucesión de la Constitución, detallada por la 25ª Enmienda (1967), coloca primero al vicepresidente si el presidente muere, renuncia o es destituido.",
"Un proyecto de ley se vuelve ley solo cuando el presidente lo firma \u2014o si dos tercios de ambas cámaras del Congreso anulan su veto.",
"El Artículo II hace al presidente comandante en jefe de las fuerzas armadas, aunque solo el Congreso puede declarar la guerra formalmente.",
"Los proyectos aprobados por el Congreso llegan al escritorio del presidente; su firma los convierte en ley.",
"El veto presidencial rechaza un proyecto aprobado por el Congreso; este puede anularlo con dos tercios de votos en ambas cámaras.",
"El presidente nomina a los jueces federales, incluidos los de la Corte Suprema, pero el Senado debe confirmarlos por mayoría.",
"El gabinete \u2014actualmente 15 jefes de departamento, como el secretario de Estado\u2014 asesora al presidente y dirige la burocracia federal día a día.",
"Cada secretario del gabinete aporta experiencia de su área (Estado, Defensa, Tesoro, etc.) para orientar las decisiones presidenciales.",
"El secretario de Estado dirige la política exterior y la diplomacia; el fiscal general encabeza el Departamento de Justicia como el principal abogado del gobierno.",
"El presidente se elige mediante el Colegio Electoral, no el voto popular nacional \u2014actualmente 538 electores en total, se necesitan 270 para ganar.",
"La Corte Suprema es el único tribunal federal que exige la propia Constitución (Artículo III); el Congreso creó todos los tribunales federales inferiores.",
"Los tribunales federales interpretan si las leyes cumplen con la Constitución \u2014poder llamado revisión judicial, establecido por Marbury v. Madison en 1803.",
"Como tribunal más alto, los fallos de la Corte Suprema son definitivos \u2014no hay un tribunal superior ante el cual apelar.",
"El Congreso fijó a la Corte en 9 jueces mediante la Ley Judicial de 1869; el número no está en la Constitución y ha cambiado seis veces en la historia.",
"Una mayoría simple de los nueve jueces \u2014cinco votos\u2014 decide la mayoría de los casos de la Corte Suprema.",
"El Artículo III da a los jueces federales cargo vitalicio (\u2018mientras observen buena conducta\u2019), así sirven hasta jubilarse, renunciar, morir o ser destituidos.",
"El cargo vitalicio protege a los jueces de tener que complacer a votantes o al presidente que los nombró.",
"John Roberts es presidente de la Corte Suprema desde 2005, nombrado por el presidente George W. Bush.",
"Acuñar moneda, declarar la guerra y firmar tratados son poderes exclusivos del gobierno federal, para que el país hable con una sola voz internacionalmente.",
"Los poderes no otorgados al gobierno federal \u2014como manejar escuelas públicas o dar licencias de conducir\u2014 quedan con los estados según la 10ª Enmienda.",
"Ratificada en 1791 como parte de la Carta de Derechos, la 10ª Enmienda reserva a los estados o al pueblo los poderes que la Constitución no da al gobierno federal.",
"Brian Kemp, republicano, es gobernador de Georgia desde enero de 2019.",
"Atlanta es la capital de Georgia desde 1868, en reemplazo de Milledgeville.",
"La 26ª Enmienda, ratificada en 1971 durante la era de la guerra de Vietnam, bajó la edad mínima para votar de 21 a 18 años.",
"Votar en elecciones federales, postularse a cargos federales y ser jurado federal son derechos reservados a los ciudadanos de EE. UU.",
"La Primera Enmienda (1791) protege la expresión, religión, prensa y reunión para todos en EE. UU., ciudadanos y no ciudadanos por igual.",
"El Juramento a la Bandera, escrito en 1892 y con su redacción actual fijada por el Congreso en 1954, expresa lealtad \u2018a la bandera... y a la República que representa\u2019.",
"El Juramento de Lealtad, recitado en cada ceremonia de naturalización, exige renunciar a lealtades previas y jurar obedecer las leyes de EE. UU.",
"La naturalización es el proceso legal \u2014con años de residencia, examen de inglés y civismo, y entrevista\u2014 por el cual alguien se hace ciudadano.",
"Votar y postularse a un cargo son dos de las formas más directas en que los ciudadanos moldean su gobierno.",
"Votar en elecciones locales, estatales y federales es la forma más básica en que los ciudadanos influyen en quién decide por ellos.",
"La 16ª Enmienda (1913) autorizó el impuesto federal sobre la renta, que el Código de Impuestos Internos exige pagar cada año a la mayoría de los residentes.",
"La Ley del Servicio Selectivo Militar exige que casi todos los hombres de 18 a 25 años en EE. UU. se registren, sin importar su estatus migratorio.",
"Los colonos llegaron por razones diversas: puritanos y cuáqueros huían de la persecución religiosa, otros buscaban tierra u oportunidades comerciales.",
"Los pueblos indígenas ya habitaban el continente por más de 10,000 años antes de que empezara la colonización europea a fines del siglo XV.",
"Desde 1619 en Jamestown, Virginia, y por dos siglos, cientos de miles de africanos fueron trasladados por la fuerza y vendidos como esclavos.",
"La Guerra de Independencia (1775-1783) comenzó en Lexington y Concord y terminó con el Tratado de París de 1783, que reconoció la independencia.",
"Leyes como la Ley del Timbre (1765) gravaron a colonos sin representantes electos en el Parlamento británico \u2014de ahí \u2018sin representación no hay impuestos\u2019.",
"Thomas Jefferson, delegado de Virginia de 33 años, fue elegido por el Congreso Continental para escribir el primer borrador en junio de 1776.",
"El Segundo Congreso Continental adoptó formalmente la Declaración el 4 de julio de 1776 en Filadelfia \u2014hoy el Día de la Independencia.",
"La noche del 25 al 26 de diciembre de 1776, George Washington cruzó con su ejército el helado río Delaware para un ataque sorpresa en Trenton.",
"Las 13 colonias originales fueron New Hampshire, Massachusetts, Rhode Island, Connecticut, Nueva York, Nueva Jersey, Pensilvania, Delaware, Maryland, Virginia, Carolina del Norte, Carolina del Sur y Georgia.",
"Los delegados se reunieron en Filadelfia de mayo a septiembre de 1787 y escribieron una Constitución enteramente nueva, firmada el 17 de septiembre de 1787.",
"Alexander Hamilton, James Madison y John Jay escribieron 85 ensayos bajo el seudónimo \u2018Publius\u2019 en 1787-1788 para lograr apoyo a la ratificación.",
"Los Federalist Papers explicaron el razonamiento detrás de la estructura de la Constitución, ayudando a convencer a convenciones estatales escépticas.",
"Benjamin Franklin fundó la Library Company of Philadelphia en 1731, considerada la primera biblioteca de préstamo exitosa de Estados Unidos.",
"George Washington fue elegido por unanimidad en 1789, sirvió dos periodos y se retiró voluntariamente en 1797, marcando el precedente de transferencia pacífica del poder.",
"Thomas Jefferson, más tarde el 3er presidente (1801-1809), es recordado principalmente como el autor principal de la Declaración de 1776.",
"James Madison ganó este apodo por su papel central en la Convención de 1787 y luego por redactar la Carta de Derechos como congresista.",
"Alexander Hamilton, nombrado por Washington en 1789, estableció el banco nacional y el sistema financiero del nuevo país.",
"En 1803, el presidente Thomas Jefferson compró unos 828,000 millas cuadradas a Francia por unos 15 millones de dólares, duplicando el tamaño del país.",
"La Guerra Civil (1861-1865), por la esclavitud y los derechos de los estados, sigue siendo la más mortífera en la historia de EE. UU., con más de 600,000 muertos.",
"La Guerra Civil enfrentó a los estados del Norte (la Unión, bajo el presidente Lincoln) contra 11 estados del Sur que formaron la Confederación.",
"Emitida por el presidente Lincoln el 1 de enero de 1863, la Proclamación de Emancipación declaró libres a los esclavizados en territorio confederado.",
"Abraham Lincoln, 16º presidente, emitió la Proclamación de Emancipación en 1863 y fue asesinado en abril de 1865, días después de terminar la guerra.",
"La Proclamación de Emancipación (1 de enero de 1863) declaró legalmente libres a los esclavizados en los estados confederados.",
"La victoria de la Unión en 1865, seguida ese mismo año por la 13ª Enmienda, puso fin a la esclavitud legal en Estados Unidos.",
"Ratificada en 1868 durante la Reconstrucción, la 14ª Enmienda garantiza la ciudadanía a cualquiera nacido en suelo estadounidense.",
"La 15ª Enmienda, ratificada en 1870, prohibió negar el voto por raza, aunque se necesitó la Ley de Derecho al Voto de 1965 para hacerla cumplir del todo.",
"Susan B. Anthony cofundó la Asociación Nacional por el Sufragio Femenino en 1869 y murió en 1906, 14 años antes de que se aprobara la 19ª Enmienda.",
"La Segunda Guerra Mundial (1939-1945), el conflicto más mortífero de la historia, llevó a EE. UU. a entrar directamente tras el ataque japonés a Pearl Harbor en diciembre de 1941.",
"Submarinos alemanes hundieron barcos estadounidenses y el interceptado Telegrama Zimmermann (1917) reveló un complot con México, empujando a EE. UU. a la 1ª Guerra Mundial ese abril.",
"La 19ª Enmienda, ratificada el 18 de agosto de 1920, garantizó el voto de las mujeres en todo el país tras décadas de organización sufragista.",
"La Gran Depresión (1929-1939) llevó el desempleo en EE. UU. a casi el 25% y transformó la política estadounidense por una generación.",
"El mercado de valores colapsó el \u2018martes negro\u2019, 29 de octubre de 1929, desatando la Gran Depresión de una década.",
"Franklin D. Roosevelt, elegido en 1932, lanzó el New Deal y guio al país durante casi toda la Segunda Guerra Mundial antes de morir en el cargo en 1945.",
"El ataque sorpresa de Japón a Pearl Harbor, Hawái, el 7 de diciembre de 1941, mató a más de 2,400 estadounidenses y llevó al Congreso a declarar la guerra al día siguiente.",
"Dwight D. Eisenhower comandó las fuerzas aliadas en Europa, planeando el desembarco de Normandía en junio de 1944, antes de ser el 34º presidente en 1953.",
"La Guerra Fría (aprox. 1947-1991) enfrentó a EE. UU. y sus aliados contra el bloque comunista soviético, sin combate directo entre ambas potencias.",
"La política de EE. UU. en la Guerra Fría se centró en la \u2018contención\u2019 \u2014evitar que el comunismo se expandiera\u2014 desde el Plan Marshall hasta Corea y Vietnam.",
"La Guerra de Corea (1950-1953) comenzó cuando Corea del Norte comunista invadió el Sur; una coalición de la ONU liderada por EE. UU. llegó a un armisticio vigente hoy.",
"La participación de EE. UU. en Vietnam (aprox. 1955-1975) buscaba impedir que Vietnam del Norte comunista unificara el país, y terminó con el retiro en 1973.",
"El Movimiento de Derechos Civiles (aprox. 1954-1968) usó protestas y demandas legales para desmantelar la segregación, logrando la Ley de Derechos Civiles de 1964.",
"Martin Luther King Jr. lideró la Marcha sobre Washington de 1963 y su discurso \u2018Tengo un sueño\u2019 antes de ser asesinado en Memphis en abril de 1968.",
"Tras la invasión iraquí a Kuwait en agosto de 1990, una coalición liderada por EE. UU. lanzó la Operación Tormenta del Desierto en enero de 1991, expulsando a las fuerzas iraquíes en semanas.",
"El 11 de septiembre de 2001, secuestradores de al-Qaeda atacaron las Torres Gemelas y el Pentágono, matando a casi 3,000 personas.",
"EE. UU. invadió Afganistán en octubre de 2001 para remover al gobierno talibán que albergaba al líder de al-Qaeda Osama bin Laden; las tropas se retiraron en agosto de 2021.",
"La Nación Navajo, la Nación Cherokee y los Sioux están entre las más de 570 tribus indígenas reconocidas federalmente en EE. UU. hoy.",
"Thomas Edison patentó un foco incandescente práctico en 1879, mientras los hermanos Wright lograron el primer vuelo motorizado en Kitty Hawk en 1903.",
"Washington, D.C. se estableció en 1790 como territorio federal neutral, formado en parte con tierras de Maryland y Virginia, para albergar al nuevo gobierno.",
"La Estatua de la Libertad, regalo de Francia inaugurado en 1886, está en Liberty Island y dio la bienvenida a inmigrantes que pasaban por la cercana Ellis Island desde 1892.",
"Las 13 franjas de la bandera se han mantenido fijas desde 1818, representando a las 13 colonias originales, aunque el número de estrellas creciera.",
"La bandera ha ganado una estrella con cada nuevo estado desde 1777; el diseño actual de 50 estrellas data del 4 de julio de 1960, tras la entrada de Hawái.",
"Francis Scott Key escribió el poema en septiembre de 1814 al ver el bombardeo británico al Fuerte McHenry; el Congreso lo declaró himno en 1931.",
"\u2018E Pluribus Unum\u2019, latín para \u2018de muchos, uno\u2019, se propuso para el Gran Sello en 1776; \u2018In God We Trust\u2019 se volvió el lema oficial después, en 1956.",
"El Día de la Independencia, 4 de julio, marca la adopción de la Declaración en 1776; se volvió día festivo federal en 1870.",
"Los días festivos federales incluyen Año Nuevo, el Día de MLK, el Día de los Presidentes, Memorial Day, Juneteenth, el 4 de julio, el Día del Trabajo, Veterans Day, Acción de Gracias y Navidad.",
"El Memorial Day, el último lunes de mayo, comenzó como \u2018Decoration Day\u2019 tras la Guerra Civil y se volvió día festivo federal oficial en 1971.",
"El Veterans Day, 11 de noviembre, comenzó como el Día del Armisticio que marcó el fin de los combates de la 1ª Guerra Mundial en 1918, renombrado en 1954 para honrar a todos los veteranos."
],
zh: [
"美国是共和制国家：公民选举参议员、众议员和总统等代表来替他们治理国家，而不是由君主统治，也不是每项法律都直接公投。",
"1788年生效的第六条\u201c最高条款\u201d规定宪法和联邦法律高于任何相抵触的州法律，自1803年\u201c马伯里诉麦迪逊案\u201d以来法院据此裁决。",
"1789年生效的宪法七个条款设立了国会、总统职位和联邦法院，并规定了各自的产生方式与权力范围。",
"序言开头\u201c我们人民\u201d表明政府的权力来自被治理者的同意，而非来自君主——这在1787年是很激进的想法。",
"第五条规定国会三分之二成员（或各州）可提出宪法修正案，须经四分之三的州批准——故意设置门槛，因此自1789年以来只通过了27条。",
"《权利法案》即前十条修正案，于1791年一并批准，保护言论、宗教等自由不受联邦政府侵犯，其中大部分由詹姆斯·麦迪逊起草。",
"自1789年以来共批准了27条修正案：1791年的《权利法案》（10条）加上后来的17条，最近一条是1992年批准的关于国会薪酬的第27条修正案。",
"《独立宣言》于1776年7月4日通过，列举了殖民地对乔治三世国王的不满，正式宣布与英国分离。",
"第二届大陆会议于1776年7月4日通过了《独立宣言》，托马斯·杰斐逊执笔初稿，本杰明·富兰克林和约翰·亚当斯参与修改。",
"《独立宣言》中\u201c人人生而平等\u201d与宪法的各项保护，都基于人生而享有政府不能公正剥夺的权利这一理念。",
"\u201c生命权、自由权和追求幸福的权利\u201d出自《独立宣言》第二段，是杰斐逊改编自哲学家约翰·洛克\u201c生命、自由和财产\u201d的说法。",
"私人和企业——而非政府——拥有大部分财产，并主要根据供需关系决定生产和销售什么。",
"任何人，包括总统，都不能凌驾于法律之上——因此总统可被调查、起诉甚至弹劾。",
"《独立宣言》关于自然权利的思想不仅启发了宪法精神，也是1787年制宪会议代表们辩论时直接引用的依据。",
"制宪者研究了哲学家孟德斯鸠的著作后将权力分为三部分，担心像乔治三世那样权力集中会导致暴政。",
"第一、二、三条分别设立国会（立法权，制定法律）、总统（行政权，执行法律）和联邦法院（司法权，解释法律），三者相互制衡。",
"第二条规定总统是行政部门首脑，负责执行国会通过的法律并统率军队。",
"第一条将\u201c全部立法权\u201d授予国会，国会是唯一能通过联邦法律的机构。",
"制宪者在1787年\u201c大妥协\u201d中将国会分为两院：参议院让每州权力平等（各2席），共435席的众议院则按人口分配。",
"根据第一条，国会的核心职权是起草并通过联邦法律；法案须经众参两院通过才能送交总统。",
"目前共有100名参议员：50个州每州2名，多于最初13个建国州每州2名共26名的规模。",
"参议员任期错开为6年一届，约三分之一席位每2年改选一次，因此参议院不会一次性全部换届。",
"佐治亚州现任两位参议员是乔恩·奥索夫和拉斐尔·沃诺克，两人均为民主党人，2021年1月的决选中首次当选。",
"自1929年《永久分配法》起众议院设435个有投票权席位；每次人口普查后各州席位会重新分配。",
"众议员任期2年，是联邦职位中最短的，因此整个众议院每个选举周期都要接受选民检验。",
"制宪者刻意把众议员任期设短，好让他们紧密回应选民当下的意见，与任期更长的参议院不同。",
"无论人口多少，每个州都恰好有2名参议员——加州和怀俄明州各有2名——这是1787年\u201c大妥协\u201d的结果。",
"特拉华州等小州在1787年制宪会议上坚持要求参议院平等代表权，担心否则会被大州主导。",
"你的众议员取决于你所在的国会选区；佐治亚州目前有14个选区，可在house.gov查询。",
"来自路易斯安那州的共和党人迈克·约翰逊自2023年10月起担任众议院议长。",
"参议员在国会代表整个州的利益，而众议员只代表自己所在的选区。",
"自1913年第十七条修正案起，参议员由全州选民直接选举产生；此前由州议会选出。",
"每位众议员只代表其所在特定国会选区的选民，全国共435个选区。",
"某选区的选民每2年直接选举产生自己的众议员。",
"众议院435个席位在每次人口普查后（最近一次为2020年）按人口重新分配，人口增长快的州会获得更多席位。",
"宪法规定总统任期为4年，兼顾足够的治理时间与定期向选民负责。",
"富兰克林·D·罗斯福连任四届（1933-1945）后，第二十二条修正案于1951年批准，规定总统最多连选连任两届。",
"唐纳德·特朗普是现任美国总统，于2025年1月就任其非连续的第二个任期。",
"曾任俄亥俄州联邦参议员的JD·万斯是现任副总统，于2025年1月就职。",
"宪法规定的继任顺序，后经1967年第二十五条修正案细化，规定若总统去世、辞职或被免职，副总统首先继任。",
"法案只有经总统签署后才能成为法律——若总统否决，国会两院各以三分之二多数即可推翻否决。",
"第二条规定总统是武装部队总司令，但只有国会才能正式宣战。",
"国会通过的法案送交总统；总统签署后即正式生效为法律。",
"总统否决权可拒绝国会通过的法案；国会可用两院各三分之二多数票推翻否决。",
"总统提名联邦法官，包括最高法院大法官，但须经参议院多数表决确认后方可上任。",
"内阁目前由15个部门首长组成，如国务卿，负责为总统提供建议并处理日常联邦行政事务。",
"每位内阁部长带来所在领域（国务院、国防部、财政部等）的专业知识，为总统决策提供参考。",
"国务卿主管外交政策与外交事务；司法部长领导司法部，是政府的首席法律顾问。",
"总统由选举人团选出，而非全国普选票——目前共538名选举人，需270票才能当选。",
"最高法院是宪法（第三条）明确要求设立的唯一联邦法院；所有下级联邦法院均由国会设立。",
"联邦法院有权解释法律是否符合宪法，即司法审查权，这一权力由1803年\u201c马伯里诉麦迪逊案\u201d确立。",
"作为最高法院，其裁决是终审裁决——没有更高一级法院可以上诉。",
"国会依据1869年《司法法》将最高法院大法官人数定为9人；这一数字并未写入宪法，历史上曾变动过六次。",
"九名大法官中简单多数（5票）即可决定大多数最高法院案件。",
"第三条赋予联邦法官\u201c品行良好期间\u201d终身任职，因此他们可任职至退休、辞职、去世或被弹劾为止。",
"终身任职使大法官无需为讨好选民或任命他们的总统而妥协，能独立依法裁决。",
"约翰·罗伯茨自2005年起担任首席大法官，由乔治·W·布什总统任命。",
"铸造货币、宣战和缔结条约等权力只属于联邦政府，以保证国家在国际和经济事务上口径一致。",
"宪法未授予联邦政府的权力——如管理公立学校或颁发驾照——依据第十条修正案保留给各州。",
"作为《权利法案》一部分于1791年批准的第十条修正案，将宪法未授予联邦政府的权力保留给各州或人民。",
"共和党人布莱恩·坎普自2019年1月起担任佐治亚州州长。",
"亚特兰大自1868年起成为佐治亚州首府，取代了米利奇维尔。",
"1971年越南战争时期批准的第二十六条修正案，将投票年龄从21岁降至18岁。",
"参加联邦选举投票、竞选联邦公职以及担任联邦陪审员，都是保留给美国公民的权利。",
"1791年通过的第一条修正案，保护美国境内所有人（无论公民与否）的言论、宗教、新闻和集会自由不受政府侵犯。",
"效忠誓言写于1892年，国会于1954年确定其现行措辞，表达对\u201c国旗……及其所代表的共和国\u201d的忠诚。",
"每场入籍仪式上宣读的效忠誓词，要求放弃对其他国家的效忠并宣誓遵守美国法律。",
"入籍是外国人成为公民的法律程序，通常需要多年居留、通过英语和公民常识考试并参加面谈。",
"投票和竞选公职是公民塑造政府最直接的两种方式。",
"参加地方、州和联邦选举投票，是公民影响谁来替他们做决定的最基本方式。",
"1913年第十六条修正案授权征收联邦所得税，如今《国内税收法》规定大多数居民每年须依法纳税。",
"《军事义务兵役法》要求居住在美国、年龄在18至25岁之间的几乎所有男性登记，无论移民身份如何。",
"殖民者出于各种原因而来：清教徒和贵格会教徒为逃避宗教迫害，也有人为寻找土地或贸易机会。",
"在15世纪末、16世纪欧洲殖民开始之前，美洲原住民各部族已在这片大陆上生活了一万多年。",
"从1619年在弗吉尼亚州詹姆斯敦开始，持续两个世纪，数十万非洲人被强行运来并被卖为奴隶。",
"独立战争（1775-1783年）始于列克星敦和康科德的战斗，1783年《巴黎条约》承认美国独立，战争结束。",
"1765年的《印花税法》等法律向在英国议会没有代表席位的殖民者征税，由此产生\u201c无代表不纳税\u201d的口号。",
"33岁的弗吉尼亚代表托马斯·杰斐逊于1776年6月被大陆会议指定执笔《独立宣言》初稿。",
"第二届大陆会议于1776年7月4日在费城正式通过《独立宣言》——这一天后来成为独立日。",
"1776年12月25日至26日夜间，乔治·华盛顿率军冒着严寒渡过特拉华河，对特伦顿发动突袭。",
"13个原始殖民地是新罕布什尔、马萨诸塞、罗德岛、康涅狄格、纽约、新泽西、宾夕法尼亚、特拉华、马里兰、弗吉尼亚、北卡罗来纳、南卡罗来纳和佐治亚。",
"代表们于1787年5月至9月在费城开会，起草了一部全新的宪法，并于1787年9月17日签署。",
"亚历山大·汉密尔顿、詹姆斯·麦迪逊和约翰·杰伊以笔名\u201c普布利乌斯\u201d于1787至1788年撰写了85篇文章，为争取批准宪法造势。",
"《联邦党人文集》阐释了宪法架构背后的思路，帮助说服了持怀疑态度的各州批准大会。",
"本杰明·富兰克林于1731年创办了费城图书馆公司，常被视为美国第一家成功的借阅图书馆。",
"乔治·华盛顿于1789年全票当选，连任两届，并于1797年主动卸任，开创了权力和平交接的先例。",
"托马斯·杰斐逊后来成为第三任总统（1801-1809年），但人们最记得他是1776年《独立宣言》的主要执笔人。",
"詹姆斯·麦迪逊因在1787年制宪会议上的核心作用、以及后来作为国会议员起草《权利法案》而获得这一称号。",
"亚历山大·汉密尔顿于1789年被华盛顿任命，建立了国家银行和这个新国家的金融体系。",
"1803年，总统托马斯·杰斐逊以约1500万美元从法国购得约82.8万平方英里土地，使国家面积倍增。",
"南北战争（1861-1865年）因奴隶制和州权问题而起，造成60多万人死亡，至今仍是美国历史上最惨烈的战争。",
"南北战争中，林肯总统领导的北方各州（联邦）对抗脱离联邦、组成南方邦联的11个州。",
"林肯总统于1863年1月1日发布《解放黑奴宣言》，宣布邦联控制地区的奴隶获得自由。",
"第16任总统亚伯拉罕·林肯于1863年发布《解放黑奴宣言》，并于1865年4月、战争结束数日后遇刺身亡。",
"《解放黑奴宣言》（1863年1月1日）宣布邦联各州被奴役的人在法律上获得自由。",
"1865年联邦军获胜后，同年通过的第十三条修正案正式终结了美国的合法奴隶制。",
"1868年重建时期批准的第十四条修正案，保证在美国出生的任何人自动获得公民身份。",
"1870年批准的第十五条修正案禁止以种族为由剥夺投票权，但直到1965年《投票权法案》通过才真正得以全面落实。",
"苏珊·B·安东尼于1869年共同创立全国妇女选举权协会，1906年去世，比第十九条修正案通过早了14年。",
"第二次世界大战（1939-1945年）是历史上最惨烈的冲突，1941年12月日本偷袭珍珠港后美国直接参战。",
"德国潜艇击沉了美国船只，被截获的1917年\u201c齐默尔曼电报\u201d揭露了德国与墨西哥的密谋，促使美国当年4月加入第一次世界大战。",
"1920年8月18日批准的第十九条修正案，在数十年妇女选举权运动之后，保障了全国妇女的投票权。",
"大萧条（1929-1939年）期间美国失业率一度接近25%，深刻改变了此后一代人的美国政治。",
"1929年10月29日\u201c黑色星期二\u201d股市崩盘，引发了长达十年的大萧条。",
"1932年当选的富兰克林·D·罗斯福推行\u201c新政\u201d，带领国家度过了大部分二战时期，1945年在任内去世。",
"1941年12月7日，日本突袭夏威夷珍珠港美军基地，造成逾2400名美国人死亡，国会次日即对日宣战。",
"德怀特·D·艾森豪威尔曾指挥欧洲盟军，策划了1944年6月的诺曼底登陆，后于1953年成为第34任总统。",
"冷战（约1947-1991年）中，美国及其盟友与苏联领导的共产主义阵营对峙，但双方从未直接交战。",
"美国冷战政策的核心是\u201c遏制\u201d——阻止共产主义扩散——从马歇尔计划到朝鲜战争、越南战争都体现了这一思路。",
"朝鲜战争（1950-1953年）始于共产主义的朝鲜入侵韩国；美国领导的联合国部队最终达成至今仍生效的停战协定。",
"美国介入越南（约1955-1975年）意在阻止共产主义的北越统一全国，最终于1973年撤军。",
"民权运动（约1954-1968年）通过抗议和法律诉讼瓦解种族隔离制度，促成了1964年《民权法案》的通过。",
"马丁·路德·金于1963年领导华盛顿大游行并发表\u201c我有一个梦想\u201d演讲，1968年4月在孟菲斯遇刺身亡。",
"1990年8月伊拉克入侵科威特后，美国领导的联军于1991年1月发动\u201c沙漠风暴行动\u201d，数周内将伊拉克军队逐出。",
"2001年9月11日，基地组织劫机者袭击了世贸中心和五角大楼，造成近3000人死亡。",
"美国于2001年10月出兵阿富汗，推翻庇护基地组织头目本·拉登的塔利班政权；军队于2021年8月撤离。",
"纳瓦霍族、切罗基族和苏族都属于美国目前联邦认可的570多个原住民部落。",
"托马斯·爱迪生于1879年获得实用白炽灯泡的专利，莱特兄弟于1903年在小鹰镇实现了首次动力飞行。",
"1790年，华盛顿哥伦比亚特区作为中立的联邦领地设立，部分土地取自马里兰州和弗吉尼亚州，用以安置新政府。",
"自由女神像是法国赠送、1886年落成的礼物，矗立在自由岛上，自1892年起迎接经由附近埃利斯岛入境的移民。",
"国旗的13道条纹自1818年起固定不变，代表最初的13个殖民地，即便星星数量随之增加。",
"自1777年起，每加入一个新州国旗就增加一颗星；现行50星设计始于1960年7月4日夏威夷加入之后。",
"弗朗西斯·斯科特·基于1814年9月目睹英军炮轰麦克亨利堡后写下这首诗；国会于1931年将其定为国歌。",
"\u201cE Pluribus Unum\u201d，拉丁语意为\u201c合众为一\u201d，1776年被提议用于国徽；\u201cIn God We Trust\u201d则是后来在1956年成为官方格言。",
"7月4日独立日纪念1776年《独立宣言》的通过，1870年成为联邦法定假日。",
"联邦法定假日包括元旦、马丁·路德·金纪念日、总统日、阵亡将士纪念日、六月节、独立日、劳动节、退伍军人节、感恩节和圣诞节。",
"阵亡将士纪念日在5月最后一个星期一，源于南北战争后的\u201c装饰日\u201d，1971年正式成为联邦法定假日。",
"退伍军人节为11月11日，最初是纪念1918年一战停战的\u201c停战日\u201d，1954年更名以纪念所有退伍军人。"
