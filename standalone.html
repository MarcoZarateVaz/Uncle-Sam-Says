tl: [
"Ang US ay isang republika: pumipili ang mga mamamayan ng mga kinatawan \u2014senador, kongresista, pangulo\u2014 na mamahala para sa kanila, sa halip na isang hari o direktang botohan sa bawat batas.",
"Ginagawa ng Supremacy Clause sa Article VI (1788) na ang Konstitusyon at pederal na batas ang nangingibabaw sa anumang salungat na batas ng estado. Ipinapatupad ito ng mga korte mula pa sa Marbury v. Madison (1803).",
"Ang pitong orihinal na artikulo, may bisa mula 1789, ang lumikha ng Kongreso, pagkapangulo, at pederal na hukuman, at tumutukoy kung paano pipiliin ang bawat isa.",
"Ang unang salita ng Preamble, \u2018We the People,\u2019 ay nangangahulugang ang awtoridad ng pamahalaan ay galing sa pahintulot ng mga pinamumunuan, hindi sa isang hari \u2014 radikal na ideya noong 1787.",
"Sa ilalim ng Article V, dalawang-katlo ng Kongreso (o mga estado) ang dapat magmungkahi ng susog, at tatlong-kapat ng mga estado ang dapat pumayag \u2014 sinadyang mahirap, kaya 27 lang ang naipasa mula 1789.",
"Ang Bill of Rights \u2014 ang unang 10 susog, pinagtibay nang sabay noong 1791 \u2014 ay nagpoprotekta ng mga karapatan tulad ng malayang pananalita at relihiyon. Si James Madison ang gumawa sa karamihan.",
"27 susog na ang naipasa mula 1789: ang Bill of Rights (10, noong 1791) kasama ang 17 pa, na ang pinakabago ay ang ika-27 Susog tungkol sa sahod ng Kongreso, pinagtibay noong 1992.",
"Pinagtibay noong Hulyo 4, 1776, inilista ng Deklarasyon ang mga hinaing ng mga kolonya laban kay Haring George III at opisyal na ipinahayag ang paghihiwalay sa Great Britain.",
"Pinagtibay ng Ikalawang Continental Congress ang Deklarasyon noong Hulyo 4, 1776. Si Thomas Jefferson ang sumulat ng unang burador, may mga pagbabago nina Benjamin Franklin at John Adams.",
"Ang \u2018lahat ng tao ay likas na pantay-pantay\u2019 sa Deklarasyon at ang mga proteksyon ng Konstitusyon ay nakabatay sa ideyang ipinanganak ang tao na may mga karapatang hindi puwedeng basta bawiin ng pamahalaan.",
"Lumitaw ang \u2018Buhay, Kalayaan, at ang paghahanap ng Kaligayahan\u2019 sa ikalawang talata ng Deklarasyon, hinango ni Jefferson mula sa \u2018buhay, kalayaan, at ari-arian\u2019 ni pilosopo John Locke.",
"Mga pribadong tao at kompanya \u2014 hindi ang gobyerno \u2014 ang nagmamay-ari ng karamihan sa ari-arian at nagpapasya kung ano ang gagawin at ibebenta, batay sa supply at demand.",
"Walang sinuman, kahit ang pangulo, ang nakahihigit sa batas \u2014 kaya puwedeng imbestigahan, idemanda, o i-impeach ang mga pangulo.",
"Bukod sa pagbibigay-inspirasyon sa Konstitusyon, ang mga ideya ng Deklarasyon tungkol sa likas na karapatan ay direktang sanggunian sa 1787 Constitutional Convention.",
"Hinati ng mga tagapagbalangkas ang kapangyarihan sa tatlong sangay matapos pag-aralan ang isinulat ni pilosopo Montesquieu, dahil sa takot na ang konsentradong kapangyarihan \u2014 tulad sa ilalim ni George III \u2014 ay hahantong sa paniniil.",
"Nililikha ng Article I, II, at III ang Kongreso (lehislatibo, gumagawa ng batas), pagkapangulo (ehekutibo, nagpapatupad), at pederal na hukuman (hudisyal, nag-iinterpret), na nagsisilbing tsek sa isa't isa.",
"Itinatalaga ng Article II ang pangulo bilang pinuno ng sangay ehekutibo, may tungkuling ipatupad ang mga batas ng Kongreso at pamunuan ang militar.",
"Ibinibigay ng Article I ang \u2018lahat ng kapangyarihang lehislatibo\u2019 sa Kongreso, ang tanging katawang makapagpapasa ng pederal na batas.",
"Hinati ng mga tagapagbalangkas ang Kongreso sa 1787 \u2018Great Compromise\u2019: pantay ang kapangyarihan ng bawat estado sa Senado (2 upuan bawat isa), habang ang 435-upuang House ay batay sa populasyon.",
"Ang pangunahing kapangyarihan ng Kongreso sa ilalim ng Article I ay ang pagsulat at pagpasa ng pederal na batas; dapat dumaan ang panukalang batas sa House at Senado bago sa pangulo.",
"100 senador ang naglilingkod ngayon: 2 bawat isa sa 50 estado, mula sa orihinal na 26 (2 bawat isa sa 13 estadong nagtatag).",
"Ang mga senador ay may 6-taong termino na nagsasalitan, kung saan mga ikatlong bahagi ng upuan ang halalan bawat 2 taon, kaya hindi bumabago ang buong Senado nang sabay-sabay.",
"Ang kasalukuyang mga senador ng Georgia ay sina Jon Ossoff at Raphael Warnock, parehong Demokratiko na unang nahalal sa runoff noong Enero 2021.",
"Ang House ay may 435 na botanteng miyembro mula sa Permanent Apportionment Act ng 1929; muling inaayos ang mga upuan sa bawat estado matapos ang bawat sensus.",
"Ang mga miyembro ng House ay may 2-taong termino, ang pinakamaikli sa anumang pederal na katungkulan, kaya hinaharap ng buong kapulungan ang mga botante sa bawat siklo.",
"Sinadyang paikliin ng mga tagapagbalangkas ang termino sa House para manatiling malapit ang mga kinatawan sa kasalukuyang opinyon ng kanilang mga botante.",
"Bawat estado ay may eksaktong 2 senador anuman ang populasyon \u2014 may 2 bawat isa ang California at Wyoming \u2014 sa ilalim ng 1787 Great Compromise.",
"Iginiit ng maliliit na estado tulad ng Delaware ang pantay na representasyon sa Senado noong 1787 Convention, dahil sa takot na madodominahan sila ng malalaking estado.",
"Depende ang iyong kinatawan sa iyong distrito sa Kongreso; mayroon ngayong 14 na distrito ang Georgia. Puwede mong tingnan ang sa iyo sa house.gov.",
"Si Mike Johnson, Republikano mula Louisiana, ang Speaker of the House mula Oktubre 2023.",
"Kinakatawan ng mga senador ang interes ng buong estado sa Kongreso, hindi tulad ng mga miyembro ng House na ang distrito lang nila ang kinakatawan.",
"Mula sa ika-17 Susog (1913), direktang inihahalal ang mga senador ng mga botante sa buong estado; dati'y ang mga lehislatura ng estado ang pumipili sa kanila.",
"Bawat miyembro ng House ay kumakatawan lamang sa mga botante sa kanilang partikular na distrito sa Kongreso, isa sa 435 sa buong bansa.",
"Direktang inihahalal ng mga botante sa isang distrito ang kanilang kinatawan tuwing 2 taon.",
"Muling inaayos ang 435 upuan sa House matapos ang bawat sensus (ang pinakabago ay 2020) batay sa populasyon, kaya nakakakuha ng mas maraming upuan ang mabilis lumaking estado.",
"Itinakda ng Konstitusyon ang 4-taong termino ng pangulo, na binabalanse ang sapat na oras para mamuno kontra sa regular na pananagutan sa mga botante.",
"Pinagtibay noong 1951 matapos manalo si Franklin D. Roosevelt nang apat na termino (1933-1945), ang ika-22 Susog ay naglilimita sa pangulo sa dalawang halal na termino.",
"Si Donald Trump ang kasalukuyang pangulo ng US, na naupo sa kanyang ikalawa, hindi magkasunod na termino noong Enero 2025.",
"Si JD Vance, dating senador ng Ohio, ang kasalukuyang bise presidente, na naupo noong Enero 2025.",
"Ang linya ng pagkakasunod-sunod sa Konstitusyon, na dinetalye pa ng ika-25 Susog (1967), ay inuuna ang bise presidente kung mamatay, magbitiw, o matanggal ang pangulo.",
"Ang panukalang batas ay nagiging batas lamang kapag pinirmahan ito ng pangulo \u2014 o kung ma-override ng dalawang-katlo ng parehong kapulungan ng Kongreso ang beto.",
"Ginagawang Commander in Chief ng armadong pwersa ang pangulo sa ilalim ng Article II, bagaman tanging Kongreso lang ang puwedeng opisyal na magdeklara ng digmaan.",
"Ang mga panukalang batas na naipasa ng Kongreso ay napupunta sa mesa ng pangulo; ang paglagda ay ginagawa itong batas.",
"Ang beto ng pangulo ay tumatanggi sa panukalang batas na naipasa ng Kongreso; puwedeng i-override ito ng Kongreso sa dalawang-katlong boto sa magkabilang kapulungan.",
"Nagno-nominate ang pangulo ng mga pederal na hukom, kabilang ang mga huwes ng Korte Suprema, pero dapat kumpirmahin sila ng Senado sa pamamagitan ng karamihang boto.",
"Ang Cabinet \u2014 na kasalukuyang 15 pinuno ng departamento, tulad ng Secretary of State \u2014 ay nagpapayo sa pangulo at nagpapatakbo sa pederal na burukrasya araw-araw.",
"Bawat kalihim sa Cabinet ay may dalang kadalubhasaan mula sa kanilang departamento (State, Defense, Treasury, atbp.) para gabayan ang mga desisyon ng pangulo.",
"Pinamumunuan ng Secretary of State ang patakarang panlabas at diplomasya; pinamumunuan naman ng Attorney General ang Department of Justice bilang punong abogado ng gobyerno.",
"Pinipili ang pangulo sa pamamagitan ng Electoral College, hindi sa pambansang popular na boto \u2014 kasalukuyang may 538 elektor sa kabuuan, 270 ang kailangan para manalo.",
"Ang Korte Suprema lamang ang pederal na hukumang direktang inaatas ng Konstitusyon (Article III); nilikha ng Kongreso ang lahat ng mas mababang pederal na hukuman.",
"Ineinterpret ng mga pederal na hukuman kung sumusunod sa Konstitusyon ang mga batas \u2014 tinatawag na judicial review, na itinatag ng Marbury v. Madison noong 1803.",
"Bilang pinakamataas na hukuman, pinal ang mga desisyon ng Korte Suprema \u2014 walang mas mataas na hukumang maaaring apilahan.",
"Itinakda ng Kongreso ang 9 na huwes para sa Korte sa pamamagitan ng Judiciary Act of 1869; wala ito sa Konstitusyon at nagbago na nang anim na beses sa kasaysayan.",
"Simpleng karamihan ng siyam na huwes \u2014 5 boto \u2014 ang nagdedesisyon sa karamihan ng kaso sa Korte Suprema.",
"Binibigyan ng Article III ang mga pederal na hukom ng habambuhay na termino (\u2018habang mabuti ang asal\u2019), kaya naglilingkod sila hanggang magretiro, magbitiw, mamatay, o ma-impeach.",
"Pinoprotektahan ng habambuhay na termino ang mga huwes mula sa pangangailangang magpasaya sa mga botante o sa pangulong nag-appoint sa kanila.",
"Si John Roberts ang Chief Justice mula 2005, na inatasan ni Pangulong George W. Bush.",
"Ang pagpapalabas ng salapi, pagdedeklara ng digmaan, at paggawa ng kasunduan ay mga kapangyarihang eksklusibo lang sa pederal na pamahalaan, para pare-pareho ang tinig ng bansa sa internasyonal na usapin.",
"Ang mga kapangyarihang hindi ibinigay sa pederal na pamahalaan \u2014 tulad ng pagpapatakbo ng pampublikong paaralan o pagbibigay ng lisensya sa pagmamaneho \u2014 ay napupunta sa mga estado sa ilalim ng ika-10 Susog.",
"Pinagtibay noong 1791 bilang bahagi ng Bill of Rights, ang ika-10 Susog ay nag-iingat sa mga estado o sa mamamayan ng mga kapangyarihang hindi ibinigay ng Konstitusyon sa pederal na pamahalaan.",
"Si Brian Kemp, Republikano, ang gobernador ng Georgia mula Enero 2019.",
"Ang Atlanta ang kabisera ng Georgia mula 1868, kapalit ng Milledgeville.",
"Ang ika-26 Susog, pinagtibay noong 1971 sa panahon ng Digmaang Vietnam, ay ibinaba ang minimum na edad sa pagboto mula 21 patungong 18.",
"Ang pagboto sa pederal na halalan, pagtakbo sa pederal na katungkulan, at pagsilbi bilang hurado sa pederal ay mga karapatang para lamang sa mamamayang Amerikano.",
"Pinoprotektahan ng Unang Susog (1791) ang malayang pananalita, relihiyon, pahayagan, at pagtitipon para sa lahat sa US, mamamayan man o hindi.",
"Ang Pledge of Allegiance, nasulat noong 1892 at binigyan ng kasalukuyang mga salita ng Kongreso noong 1954, ay nagpapahayag ng katapatan sa \u2018bandila... at sa Republika kung saan ito kumakatawan.\u2019",
"Ang Oath of Allegiance, binibigkas sa bawat seremonya ng naturalisasyon, ay nangangailangan ng pagsuko sa dating katapatan at pangakong susundin ang mga batas ng US.",
"Ang naturalisasyon ay ang legal na proseso \u2014 na may kinakailangang taon ng paninirahan, pagsusulit sa Ingles at kaalamang sibiko, at panayam \u2014 kung paano nagiging mamamayan ang isang dayuhan.",
"Ang pagboto at pagtakbo sa katungkulan ay dalawa sa pinaka-direktang paraan para hubugin ng mamamayan ang kanilang pamahalaan.",
"Ang pagboto sa lokal, estado, at pederal na halalan ang pinakapangunahing paraan kung paano naiimpluwensyahan ng mamamayan kung sino ang magdedesisyon para sa kanila.",
"Ang ika-16 Susog (1913) ay nagbigay-awtoridad sa pederal na buwis sa kita, na kasalukuyang iniaatas ng Internal Revenue Code sa karamihan ng residente na bayaran taun-taon.",
"Iniaatas ng Military Selective Service Act sa halos lahat ng lalaking edad 18 hanggang 25 na naninirahan sa US na magparehistro, anuman ang kanilang katayuan sa imigrasyon.",
"Dumating ang mga kolonista sa iba't ibang dahilan: tumakas ang mga Puritan at Quaker sa pang-uusig sa relihiyon, ang iba naman ay naghanap ng lupa o pagkakataon sa kalakalan.",
"Nanirahan na ang mga bansang Katutubong Amerikano sa buong kontinente sa loob ng higit 10,000 taon bago nagsimula ang kolonisasyong Europeo noong huling bahagi ng dekada 1400.",
"Simula 1619 sa Jamestown, Virginia, at sa loob ng dalawang siglo, daan-daang libong Africano ang sapilitang dinala at ipinagbili bilang alipin.",
"Nagsimula ang Rebolusyong Amerikano (1775-1783) sa Lexington at Concord at natapos sa Treaty of Paris ng 1783 na kumilala sa kalayaan.",
"Binuwisan ng mga batas tulad ng Stamp Act (1765) ang mga kolonista na walang halal na kinatawan sa British Parliament \u2014 kaya lumitaw ang \u2018walang buwis kung walang representasyon.\u2019",
"Si Thomas Jefferson, 33-anyos na delegado ng Virginia, ang pinili ng Continental Congress na sumulat ng unang burador noong Hunyo 1776.",
"Opisyal na pinagtibay ng Ikalawang Continental Congress ang Deklarasyon noong Hulyo 4, 1776, sa Philadelphia \u2014 ngayo'y ipinagdiriwang bilang Independence Day.",
"Sa gabi ng Disyembre 25-26, 1776, pinamunuan ni George Washington ang kanyang hukbo sa pagtawid sa nagyeyelong Ilog Delaware para sa sorpresang atake sa Trenton.",
"Ang 13 orihinal na kolonya ay New Hampshire, Massachusetts, Rhode Island, Connecticut, New York, New Jersey, Pennsylvania, Delaware, Maryland, Virginia, North Carolina, South Carolina, at Georgia.",
"Nagpulong ang mga delegado sa Philadelphia mula Mayo hanggang Setyembre 1787 at sumulat ng ganap na bagong Konstitusyon, na nilagdaan noong Setyembre 17, 1787.",
"Sina Alexander Hamilton, James Madison, at John Jay ang sumulat ng 85 sanaysay sa ilalim ng sagisag na \u2018Publius\u2019 noong 1787-1788 para makakuha ng suporta sa pagpapatibay.",
"Ipinaliwanag ng Federalist Papers ang katwiran sa likod ng estruktura ng Konstitusyon, na tumulong makumbinsi ang mga alanganing kumbensyon ng mga estado.",
"Itinatag ni Benjamin Franklin ang Library Company of Philadelphia noong 1731, na madalas tawaging unang matagumpay na aklatang pautang ng Amerika.",
"Naihalal si George Washington nang tuluyan noong 1789, naglingkod ng dalawang termino, at kusang-loob na umalis noong 1797, itinatag ang tradisyon ng mapayapang paglipat ng kapangyarihan.",
"Si Thomas Jefferson, na naging ika-3 pangulo (1801-1809), ay pinakaalala bilang punong may-akda ng Deklarasyon ng 1776.",
"Nakuha ni James Madison ang bansag na ito dahil sa mahalagang papel niya sa 1787 Convention at pagsulat ng Bill of Rights bilang kongresista.",
"Itinatag ni Alexander Hamilton, na inatasan ni Washington noong 1789, ang pambansang bangko at sistemang pinansyal ng bagong bansa.",
"Noong 1803, bumili si Pangulong Thomas Jefferson ng humigit-kumulang 828,000 milya kuwadrado mula sa France sa halagang mga $15 milyon, na dinoble ang laki ng bansa.",
"Ang Digmaang Sibil (1861-1865), na labanan dahil sa pang-aalipin at karapatan ng mga estado, ay nananatiling pinakamamatay na digmaan sa kasaysayan ng US, na may mahigit 600,000 namatay.",
"Ang Digmaang Sibil ay naglagay sa hilagang mga estado (ang Union, sa ilalim ni Pangulong Lincoln) laban sa 11 estado ng timog na humiwalay para bumuo ng Confederacy.",
"Inilabas ni Pangulong Lincoln noong Enero 1, 1863 ang Emancipation Proclamation, na nagpahayag ng kalayaan ng mga aliping nasa teritoryo ng Confederacy.",
"Si Abraham Lincoln, ika-16 na pangulo, ang naglabas ng Emancipation Proclamation noong 1863 at pinatay noong Abril 1865, ilang araw matapos matapos ang digmaan.",
"Ipinahayag ng Emancipation Proclamation (Enero 1, 1863) na malaya sa batas ang mga aliping nasa mga estadong Confederate.",
"Ang tagumpay ng Union noong 1865, sinundan ng ika-13 Susog sa parehong taon, ang nagtapos sa legal na pang-aalipin sa Estados Unidos.",
"Pinagtibay noong 1868 sa panahon ng Reconstruction, ginagarantiya ng ika-14 Susog ang pagkamamamayan sa sinumang ipinanganak sa lupang Amerikano.",
"Ang ika-15 Susog, pinagtibay noong 1870, ay nagbawal na tanggihan ang boto batay sa lahi, bagaman kinailangan pa ng Voting Rights Act ng 1965 para lubos itong maipatupad.",
"Nagtatag si Susan B. Anthony ng National Woman Suffrage Association noong 1869 at namatay noong 1906, 14 na taon bago naipasa ang ika-19 Susog.",
"Ang Ikalawang Digmaang Pandaigdig (1939-1945), ang pinakamamatay na tunggalian sa kasaysayan, ay direktang nagpasok sa US matapos ang pag-atake ng Japan sa Pearl Harbor noong Disyembre 1941.",
"Nilubog ng mga submarinong Aleman ang mga barkong Amerikano at inaresto ang 1917 Zimmermann Telegram na naghayag ng balak kasama ang Mexico, na nagtulak sa US papasok sa WWI noong Abril.",
"Ang ika-19 Susog, pinagtibay noong Agosto 18, 1920, ang naggarantiya ng karapatang bumoto ng mga babae sa buong bansa matapos ang dekadang organisasyon ng suffragist.",
"Ang Great Depression (1929-1939) ay naging sanhi ng halos 25% na unemployment sa US at binago ang pulitika ng Amerika sa loob ng isang henerasyon.",
"Bumagsak ang stock market noong \u2018Black Tuesday,\u2019 Oktubre 29, 1929, na nagpasimula ng dekadang Great Depression.",
"Si Franklin D. Roosevelt, na nahalal noong 1932, ang naglunsad ng New Deal at namuno sa bansa sa karamihan ng Ikalawang Digmaang Pandaigdig bago namatay habang nasa katungkulan noong 1945.",
"Ang sorpresang pag-atake ng Japan sa Pearl Harbor, Hawaii, noong Disyembre 7, 1941, ay pumatay ng mahigit 2,400 Amerikano at nagtulak sa Kongreso na magdeklara ng digmaan kinabukasan.",
"Pinamunuan ni Dwight D. Eisenhower ang mga pwersang Allied sa Europa, nagplano ng D-Day invasion noong Hunyo 1944, bago naging ika-34 na pangulo noong 1953.",
"Ang Cold War (mga 1947-1991) ay naglagay sa US at mga kaalyado nito laban sa komunistang bloke ng Soviet Union, nang walang direktang labanan sa pagitan ng dalawa.",
"Nakasentro ang patakaran ng US sa Cold War sa \u2018containment\u2019 \u2014 pagpigil sa paglaganap ng komunismo \u2014 mula Marshall Plan hanggang Korea at Vietnam.",
"Nagsimula ang Digmaang Korea (1950-1953) nang salakayin ng komunistang North Korea ang South; ang koalisyon ng UN na pinamumunuan ng US ay umabot sa armistice na umiiral pa rin ngayon.",
"Layunin ng partisipasyon ng US sa Vietnam (mga 1955-1975) na pigilan ang komunistang North Vietnam na pagsamahin ang bansa, natapos sa pag-alis noong 1973.",
"Ginamit ng Civil Rights Movement (mga 1954-1968) ang protesta at legal na hamon para wasakin ang segregasyon, na humantong sa Civil Rights Act ng 1964.",
"Pinamunuan ni Martin Luther King Jr. ang 1963 March on Washington at ang talumpating \u2018I Have a Dream\u2019 bago siya pinatay sa Memphis noong Abril 1968.",
"Matapos salakayin ng Iraq ang Kuwait noong Agosto 1990, naglunsad ang koalisyong pinamumunuan ng US ng Operation Desert Storm noong Enero 1991, na pinaalis ang pwersang Iraqi sa loob ng ilang linggo.",
"Noong Setyembre 11, 2001, inatake ng mga hijacker ng al-Qaeda ang World Trade Center at Pentagon, na pumatay ng halos 3,000 katao.",
"Sinalakay ng US ang Afghanistan noong Oktubre 2001 para alisin ang gobyernong Taliban na nagtatago sa lider ng al-Qaeda na si Osama bin Laden; umalis ang tropa noong Agosto 2021.",
"Kabilang ang Navajo Nation, Cherokee Nation, at Sioux sa mahigit 570 tribong Katutubong Amerikanong kinikilala ng pederal na pamahalaan ngayon.",
"Pinatentahan ni Thomas Edison ang praktikal na bombilya noong 1879, samantalang nakamit ng magkapatid na Wright ang unang lipad na may makina sa Kitty Hawk noong 1903.",
"Itinatag ang Washington, D.C. noong 1790 bilang neutral na pederal na teritoryo, kinuha nang bahagi mula Maryland at Virginia, para tirahan ng bagong pamahalaan.",
"Ang Statue of Liberty, regalo ng France na itinalaga noong 1886, ay nasa Liberty Island, tumatanggap sa mga imigranteng dumadaan sa kalapit na Ellis Island mula 1892.",
"Nananatiling 13 ang guhit sa bandila mula 1818, na kumakatawan sa 13 orihinal na kolonya, kahit lumalago ang bilang ng bituin.",
"Nakakakuha ang bandila ng bagong bituin sa bawat bagong estado mula 1777; ang kasalukuyang disenyong 50-bituin ay mula Hulyo 4, 1960, matapos sumapi ang Hawaii.",
"Isinulat ni Francis Scott Key ang tula noong Setyembre 1814 habang pinapanood ang pagbomba ng British sa Fort McHenry; ginawa itong pambansang awit ng Kongreso noong 1931.",
"Ang \u2018E Pluribus Unum,\u2019 Latin para sa \u2018mula sa marami, iisa,\u2019 ay iminungkahi para sa Great Seal noong 1776; ang \u2018In God We Trust\u2019 ay naging opisyal na motto nang mas huli, noong 1956.",
"Ang Independence Day, Hulyo 4, ay minarkahan ang pagpapatibay ng Deklarasyon noong 1776; naging pederal na pista opisyal ito noong 1870.",
"Kabilang sa pederal na piyesta opisyal ang New Year's Day, MLK Day, Presidents Day, Memorial Day, Juneteenth, Independence Day, Labor Day, Veterans Day, Thanksgiving, at Christmas.",
"Ang Memorial Day, huling Lunes ng Mayo, ay nagsimula bilang \u2018Decoration Day\u2019 matapos ang Digmaang Sibil at naging opisyal na pederal na piyesta noong 1971.",
"Ang Veterans Day, Nobyembre 11, ay nagsimula bilang Armistice Day na minarkahan ang pagtatapos ng away sa WWI noong 1918, pinalitan ng pangalan noong 1954 para parangalan ang lahat ng beterano."
],
vi: [
"Hoa Kỳ là một nước cộng hòa: công dân bầu ra đại diện \u2014 thượng nghị sĩ, hạ nghị sĩ, tổng thống \u2014 để cai trị thay họ, thay vì có vua hoặc biểu quyết trực tiếp mọi đạo luật.",
"Điều khoản Tối cao ở Điều VI (1788) quy định Hiến pháp và luật liên bang vượt trên bất kỳ luật bang nào mâu thuẫn. Tòa án áp dụng điều này từ vụ Marbury kiện Madison năm 1803.",
"Bảy điều khoản gốc, có hiệu lực từ 1789, lập ra Quốc hội, chức tổng thống và tòa án liên bang, quy định cách chọn và quyền hạn của từng cơ quan.",
"Câu mở đầu của Lời mở đầu, \u2018Chúng tôi, Nhân dân,\u2019 nghĩa là quyền lực chính phủ đến từ sự đồng thuận của người dân, không phải từ một vị vua \u2014 ý tưởng táo bạo vào năm 1787.",
"Điều V cho phép hai phần ba Quốc hội (hoặc các bang) đề xuất tu chính án, và ba phần tư số bang phải phê chuẩn \u2014 cố tình khó khăn, nên chỉ có 27 tu chính án được thông qua từ 1789.",
"Tuyên ngôn Nhân quyền \u2014 10 tu chính án đầu tiên, được phê chuẩn cùng lúc năm 1791 \u2014 bảo vệ các quyền tự do như ngôn luận, tôn giáo khỏi chính phủ liên bang. James Madison soạn thảo phần lớn.",
"27 tu chính án đã được thông qua từ 1789: Tuyên ngôn Nhân quyền (10, năm 1791) cộng thêm 17 tu chính án khác, gần nhất là Tu chính án 27 về lương Quốc hội, phê chuẩn năm 1992.",
"Được thông qua ngày 4/7/1776, Tuyên ngôn liệt kê những bất bình của các thuộc địa với Vua George III và chính thức tuyên bố tách khỏi nước Anh.",
"Đại hội Lục địa lần hai thông qua Tuyên ngôn ngày 4/7/1776. Thomas Jefferson viết bản thảo đầu tiên, có sự chỉnh sửa của Benjamin Franklin và John Adams.",
"Câu \u2018mọi người sinh ra đều bình đẳng\u2019 trong Tuyên ngôn và các điều khoản bảo vệ của Hiến pháp đều dựa trên ý tưởng con người sinh ra đã có những quyền mà chính phủ không thể tước đoạt một cách chính đáng.",
"\u2018Quyền Sống, Tự do và mưu cầu Hạnh phúc\u2019 xuất hiện ở đoạn hai của Tuyên ngôn, được Jefferson chuyển thể từ câu \u2018sự sống, tự do và tài sản\u2019 của triết gia John Locke.",
"Cá nhân và doanh nghiệp tư nhân \u2014 chứ không phải chính phủ \u2014 sở hữu phần lớn tài sản và quyết định sản xuất, bán gì, chủ yếu dựa theo cung và cầu.",
"Không ai, kể cả tổng thống, đứng trên luật pháp \u2014 đó là lý do tổng thống có thể bị điều tra, kiện, hoặc bị luận tội.",
"Ngoài việc truyền cảm hứng cho tinh thần Hiến pháp, những tư tưởng về quyền tự nhiên trong Tuyên ngôn còn là căn cứ trực tiếp mà các nhà lập quốc dựa vào tại Hội nghị Lập hiến năm 1787.",
"Các nhà lập quốc chia quyền lực thành ba nhánh sau khi nghiên cứu tác phẩm của triết gia Montesquieu, vì lo ngại quyền lực tập trung \u2014 như dưới thời Vua George III \u2014 sẽ dẫn đến chuyên chế.",
"Điều I, II và III lập ra Quốc hội (lập pháp, làm luật), tổng thống (hành pháp, thi hành luật) và tòa án liên bang (tư pháp, giải thích luật), mỗi nhánh kiểm soát lẫn nhau.",
"Điều II quy định tổng thống là người đứng đầu nhánh hành pháp, chịu trách nhiệm thi hành luật do Quốc hội thông qua và chỉ huy quân đội.",
"Điều I trao \u2018toàn bộ quyền lập pháp\u2019 cho Quốc hội \u2014 cơ quan duy nhất có thể thông qua luật liên bang.",
"Các nhà lập quốc chia Quốc hội thành hai viện trong \u2018Thỏa hiệp Lớn\u2019 năm 1787: Thượng viện cho mỗi bang quyền lực ngang nhau (2 ghế mỗi bang), còn Hạ viện với 435 ghế dựa trên dân số.",
"Quyền lực cốt lõi của Quốc hội theo Điều I là soạn thảo và thông qua luật liên bang; dự luật phải qua cả Hạ viện và Thượng viện trước khi đến tổng thống.",
"Hiện có 100 thượng nghị sĩ: 2 người mỗi bang trong số 50 bang, tăng từ con số 26 ban đầu (2 người mỗi bang trong 13 bang sáng lập).",
"Thượng nghị sĩ phục vụ nhiệm kỳ 6 năm so le, khoảng một phần ba số ghế được bầu lại mỗi 2 năm, nên Thượng viện không bao giờ thay đổi toàn bộ cùng lúc.",
"Hai thượng nghị sĩ hiện tại của Georgia là Jon Ossoff và Raphael Warnock, cả hai đều thuộc Đảng Dân chủ, lần đầu đắc cử trong vòng bầu cử bổ sung tháng 1/2021.",
"Hạ viện có 435 thành viên có quyền biểu quyết từ Đạo luật Phân bổ Vĩnh viễn năm 1929; số ghế được phân bổ lại giữa các bang sau mỗi cuộc điều tra dân số.",

"Hoa Kỳ xâm lược Afghanistan vào tháng 10/2001 để lật đổ chính quyền Taliban đang chứa chấp thủ lĩnh al-Qaeda Osama bin Laden; quân đội rút lui vào tháng 8/2021.",
"Bộ tộc Navajo, Cherokee và Sioux nằm trong số hơn 570 bộ tộc Người Mỹ bản địa được liên bang công nhận tại Hoa Kỳ ngày nay.",
"Thomas Edison được cấp bằng sáng chế bóng đèn sợi đốt thực dụng năm 1879, trong khi anh em nhà Wright thực hiện chuyến bay có động cơ đầu tiên tại Kitty Hawk năm 1903.",
"Washington, D.C. được thành lập năm 1790 làm lãnh thổ liên bang trung lập, lấy một phần đất từ Maryland và Virginia, để đặt trụ sở chính phủ mới.",
"Tượng Nữ thần Tự do, món quà từ Pháp khánh thành năm 1886, đứng trên đảo Liberty, chào đón người nhập cư đi qua đảo Ellis gần đó từ năm 1892.",
"13 sọc trên lá cờ được giữ nguyên từ năm 1818, đại diện cho 13 thuộc địa ban đầu, dù số ngôi sao tiếp tục tăng lên.",
"Lá cờ có thêm một ngôi sao mỗi khi có bang mới gia nhập từ năm 1777; thiết kế 50 ngôi sao hiện tại có từ ngày 4/7/1960, sau khi Hawaii gia nhập.",
"Francis Scott Key viết bài thơ vào tháng 9/1814 khi chứng kiến quân Anh oanh tạc Pháo đài McHenry; Quốc hội chọn nó làm quốc ca năm 1931.",
"\u2018E Pluribus Unum,\u2019 tiếng Latin nghĩa là \u2018từ nhiều thành một,\u2019 được đề xuất cho Quốc huy năm 1776; \u2018In God We Trust\u2019 trở thành khẩu hiệu chính thức sau đó, vào năm 1956.",
"Ngày Độc lập, 4/7, đánh dấu việc thông qua Tuyên ngôn năm 1776; trở thành ngày lễ liên bang năm 1870.",
"Các ngày lễ liên bang gồm Tết Dương lịch, Ngày MLK, Ngày Tổng thống, Memorial Day, Juneteenth, Ngày Độc lập, Ngày Lao động, Ngày Cựu chiến binh, Lễ Tạ ơn và Giáng sinh.",
"Memorial Day, thứ Hai cuối cùng của tháng 5, bắt đầu như \u2018Ngày Trang hoàng\u2019 sau Nội chiến và trở thành ngày lễ liên bang chính thức năm 1971.",
"Veterans Day, ngày 11/11, khởi đầu là Ngày Đình chiến đánh dấu kết thúc giao tranh Thế chiến I năm 1918, được đổi tên năm 1954 để vinh danh mọi cựu chiến binh."
]

for(var i=0;i<qs.length;i+=size){ chunks.push(qs.slice(i,i+size)); }
if(chunks.length>1 && chunks[chunks.length-1].length<4){

}
return chunks;
}

var REDUCE_MOTION = (typeof window.matchMedia==='function') && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateNumber(el,from,to,duration){
if(!el) return;
if(REDUCE_MOTION || from===to){ el.textContent=to; return; }
var start=null;
function step(ts){
if(!start) start=ts;
var progress=Math.min((ts-start)/duration,1);
var eased=1-Math.pow(1-progress,3);
el.textContent=Math.round(from+(to-from)*eased);
if(progress<1){ requestAnimationFrame(step); }else{ el.textContent=to; }
}
requestAnimationFrame(step);
}

function classify(ans){ return /\d/.test(ans) ? 'NUM' : 'TXT'; }
function pickDistractors(item,count){
var others = Q.filter(function(x){return x.n!==item.n;});
var correct=primaryAnswer(item);
var accepted=acceptedAnswers(item).map(function(a){return normalize(a).replace(/\([^)]*\)/g,'').trim();});
var type = classify(correct);
var sameCatType = others.filter(function(x){return x.cat===item.cat && classify(primaryAnswer(x))===type;});
var pool = sameCatType.length>=count ? sameCatType : others.filter(function(x){return classify(primaryAnswer(x))===type;});
if(pool.length<count) pool = others;
var picked = shuffle(pool).slice(0,count+12).map(function(x){return primaryAnswer(x);});
var uniq=[];
picked.forEach(function(p){
 var pn=normalize(p).replace(/\([^)]*\)/g,'').trim();
 if(accepted.indexOf(pn)===-1 && uniq.indexOf(p)===-1) uniq.push(p);
});
return uniq.slice(0,count);
}
function normalize(s){
return s.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/-/g,' ').replace(/[().,;:!?"]/g,' ').replace(/\s+/g,' ').trim();
}
function tokenize(s){
return normalize(s).split(' ').filter(function(t2){ return t2.length>1 && STOPWORDS.indexOf(t2)===-1; });
}
function isCorrectFreeText(typed,expected,strictness){
var item=arguments.length>3?arguments[3]:null;
if(item&&typeof isAcceptedText==='function') return isAcceptedText(typed,item,strictness);
var tTok=tokenize(typed), eTok=tokenize(expected);
if(eTok.length===0) return tTok.length>0;
for(var i=0;i<eTok.length;i++){ if(/^\d+$/.test(eTok[i]) && tTok.indexOf(eTok[i])!==-1) return true; }
var matched=0; eTok.forEach(function(t2){ if(tTok.indexOf(t2)!==-1) matched++; });
if(eTok.length<=2) return matched>=1;
return matched/eTok.length >= (strictness==='hard' ? 0.4 : 0.3);
}
function maskHint(s){
return s.replace(/[A-Za-z]+/g,function(w){ return w.length<=1 ? w : w[0]+'_'.repeat(w.length-1); });
}

function loadProgress(){
try{

if(typeof data.totalPoints==='number') totalPoints=data.totalPoints;
if(typeof data.bestStreakEver==='number') bestStreakEver=data.bestStreakEver;

if(typeof data.generalReview.timeAttackRecord==='number') GENERAL_REVIEW_LEVEL.timeAttackRecord=data.generalReview.timeAttackRecord;
}
if(data.levels){
FLAT_LEVELS.forEach(function(lv){
var rec=data.levels[lv.worldIndex+'-'+lv.levelIndex];
if(rec){
if(typeof rec.stars==='number') lv.stars=rec.stars;
if(rec.expertDone) lv.expertDone=true;
if(typeof rec.streakRecord==='number') lv.streakRecord=rec.streakRecord;
if(typeof rec.timeAttackRecord==='number') lv.timeAttackRecord=rec.timeAttackRecord;
}
if(rec && typeof rec.unlocked==='boolean'){
lv.unlocked=rec.unlocked;
}else if(lv.flatIdx>0){
var prev=FLAT_LEVELS[lv.flatIdx-1];
if(prev.stars>=1 || prev.unlocked) lv.unlocked=true;
}
});
}
}catch(e){}
}

function selectOption(item,chosenText,btnEl,container){
if(answered) return;
if(!ensureProfile(item)) return;
answered=true;
clearTimeout(timeAttackHandle);
var accepted=acceptedAnswers(item);
var normChoice=normalize(chosenText).replace(/\([^)]*\)/g,'').trim();
var correct = accepted.some(function(a){return normalize(a).replace(/\([^)]*\)/g,'').trim()===normChoice;});
rememberAnswerForReport(item,chosenText,correct);
Array.prototype.forEach.call(container.children,function(b){
 b.disabled=true;
 var bn=normalize(b.textContent).replace(/\([^)]*\)/g,'').trim();
 var isAccepted=accepted.some(function(a){return normalize(a).replace(/\([^)]*\)/g,'').trim()===bn;});
 if(isAccepted) b.classList.add('correct');
 else if(b===btnEl && !correct) b.classList.add('wrong');
});
if(runMode==='time-attack'){ markTimeAttack(correct); return; }
mark(correct);
}

function mark(correct,extraPoints){
registerDailyPractice();
if(runMode==='streak-mix'){ if(correct) runStreak++; }
if(correct){
var mult=multiplier();
var gained=Math.round(10*mult)+(extraPoints||0);
roundPoints+=gained; totalPoints+=gained; roundCorrect++;
streak++; if(streak>roundBestStreak) roundBestStreak=streak;
stampCard('approve');

var priorBest=bestStreakEver;
if(streak>bestStreakEver) bestStreakEver=streak;
var newMilestone = (streak>priorBest && streak%5===0) ? streak : null;

var regen=false;
if(streak%5===0 && attempts<MAX_ATTEMPTS){ attempts++; regen=true; }

if(newMilestone) toast(t('toastMilestone',{n:newMilestone}));
else if(regen) toast(t('toastRegen',{n:streak}));
}else{
streak=0;
attempts--;
stampCard('retry');
}
renderStats();
saveProgress();
if(runMode==='streak-mix' && !correct){
setTimeout(function(){ showRunEndScreen('streak-mix'); },700);
return;
}
showResultPanel(correct);
}

function markTimeAttack(correct){
registerDailyPractice();
if(correct){
runStreak++;
totalPoints+=10;
stampCard('approve');
renderStats();
saveProgress();
timeLimit=Math.max(4.0, timeLimit-0.15);
setTimeout(function(){
idx++;
if(idx>=deck.length){ deck=shuffle(curLevel.questions.slice()); idx=0; }
renderCard();
},450);
}else{
stampCard('retry');
renderStats();
setTimeout(function(){ showRunEndScreen('time-attack'); },700);
}
}

function decorate(r){var e=document.getElementById('end-screen');if(!e||document.getElementById('v3-end'))return;var b=document.createElement('div');b.id='v3-end';b.className='v3-exam-breakdown';var cat=Object.keys(r.categories||{}).map(function(k){var z=r.categories[k],a=z.n?Math.round(z.c/z.n*100):0;return '<div class="v3-cat-chip"><span>'+esc(catNameV(k))+'</span><strong>'+a+'%</strong></div>';}).join('');b.innerHTML='<div class="v3-row"><strong>Resumen:</strong> '+esc(r.kind)+' · '+r.correct+'/'+r.total+' · '+r.accuracy+'%'+(r.avgMs?' · '+(r.avgMs/1000).toFixed(1)+'s/pregunta':'')+'</div>'+(cat?'<div class="v3-row"><strong>Por categoría</strong>'+cat+'</div>':'');e.appendChild(b);}
window.v3Dashboard=dashboard;window.v3Adaptive=adaptive;window.v3Daily=daily;window.v3Settings=settings;
var om=window.mark,ota=window.markTimeAttack;
function startTrack(kind){if(!active)track(kind);}
var wrapNames=[['startExam','exam'],['startLevel','level'],['startLevelTier','level'],['startLevelStreak','streak-mix'],['startLevelTimeAttack','time-attack'],['startLevelExpert','expert'],['startGeneralReviewTier','level'],['startGeneralReviewStreak','streak-mix'],['startGeneralReviewTimeAttack','time-attack']];
wrapNames.forEach(function(pair){var fn=window[pair[0]];if(typeof fn==='function'){window[pair[0]]=function(){startTrack(pair[1]);return fn.apply(this,arguments);};}});
var ob=window.beginSession;window.mark=function(ok,extra){var item=deck&&deck[idx],ms=lastAnswerAt?Date.now()-lastAnswerAt:0;record(item,!!ok,ms,curLevel===null?'exam':'level');if(active){active.total++;if(ok)active.correct++;active.answers.push({ms:ms,cat:item&&item.cat,ok:!!ok});}fx(!!ok);var r=om.apply(this,arguments);if(active&&idx>=deck.length-1)setTimeout(finish,900);return r;};window.markTimeAttack=function(ok){var item=deck&&deck[idx],ms=lastAnswerAt?Date.now()-lastAnswerAt:0;record(item,!!ok,ms,'time-attack');if(active){active.total++;if(ok)active.correct++;active.answers.push({ms:ms,cat:item&&item.cat,ok:!!ok});}fx(!!ok);var r=ota.apply(this,arguments);if(active&&!ok)setTimeout(finish,900);return r;};
var mo=new MutationObserver(function(){var end=document.getElementById('end-screen');if(active&&end&&end.style.display==='block')setTimeout(finish,80);toolbar();reportButton();lastAnswerAt=Date.now();});mo.observe(document.body,{subtree:true,childList:true});
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||''))return;if(document.getElementById('v3-modal')){if(e.key==='Escape')close();return;}if(document.getElementById('play-view')?.style.display==='none')return;var n=parseInt(e.key,10),bs=document.querySelectorAll('.choice-btn');if(n>=1&&n<=4&&bs[n-1])bs[n-1].click();else if(e.key==='Enter'){var b=document.querySelector('#controls button:not([disabled])');if(b)b.click();}});
function isStandalone(){return window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function updateInstallButton(){var b=document.getElementById('v3-install-btn');if(!b)return;if(isStandalone()){b.hidden=true;return;}b.hidden=!installEvent;}
async function installApp(){if(isStandalone())return;if(!installEvent){open(t('installTitle'),'<div class=\"v3-row\"><strong>'+t('installUnavailable')+'</strong></div><div class=\"v3-small v3-muted\">En Android con Chrome, abre esta página por HTTPS y el botón aparecerá automáticamente cuando el navegador permita la instalación. En iPhone/iPad, iOS no permite que una página web abra directamente el instalador; allí es necesario usar la opción de instalación del navegador.</div>');return;}var e=installEvent;installEvent=null;try{await e.prompt();await e.userChoice;}catch(err){}updateInstallButton();}
window.v3InstallApp=installApp;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvent=e;updateInstallButton();});
window.addEventListener('appinstalled',function(){installEvent=null;updateInstallButton();});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
setTimeout(function(){toolbar();reportButton();updateInstallButton();initShake();},300);
})();
